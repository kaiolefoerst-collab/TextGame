- id: kirchhof
  name: Kirchhof
  type: location
  physical: true
  layers:
  - present
  locatedIn: null
  initialState:
    visible: true
  initialPartOf: []
  presentation:
    firstView: |-
      Eine niedrige Bruchsteinmauer umschließt den Kirchhof. Die Grabsteine stehen schief, viele sind umgekippt, die Namen von Flechten zerfressen. Krähen sitzen auf dem Dach der Kapelle und sehen dir zu, ohne einen Laut.

      Nahe dem Tor steht ein kleiner weißer Grabstein, sauberer als alle anderen. Außerhalb der Mauer, wo das Gras hoch und ungemäht steht, ragt ein einfaches Holzkreuz aus dem Boden.
    repeatView: Der stille Kirchhof. Die Krähen auf der Kapelle.
  image: 'Ein verwilderter Dorfkirchhof, rundum von einer niedrigen Mauer aus grauem Bruchstein umschlossen.
    Innerhalb der Mauer stehen alle Grabsteine: schief, teils umgestürzt, von Flechten überwuchert, im
    hohen Gras. Ebenfalls innerhalb der Mauer, nahe dem Tor, steht ein kleiner weißer Grabstein, sauber
    und ohne Flechten. Hinter den Gräbern eine kleine Kapelle aus grauem Bruchstein mit einem schmalen
    Glockentürmchen und Schieferdach, auf deren Dach schwarze Krähen sitzen. Außerhalb der Mauer gibt
    es keine Grabsteine; dort steht im ungemähten Gras als einziges Grabzeichen ein schiefes Holzkreuz
    aus zwei grob zusammengenagelten, verwitterten Latten. Dichter Nebel.'
