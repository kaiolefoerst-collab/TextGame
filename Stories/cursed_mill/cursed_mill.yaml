    repeatView: 'Die Arbeitsanweisung:'
    contentText: |-
      ARBEITSANWEISUNG

      Den Entlastungskanal dauerhaft mit Balken und Bruchsteinen verschließen. Der gesamte Wasserlauf ist der Turbine zuzuführen.

      Richard Brandt

      Bleistiftnotiz eines Arbeiters am Rand:
      „Das Mädchen von der Mühle hat uns gesehen. Sie sagt, sie hat alles in Hannes’ Buch geschrieben.“
