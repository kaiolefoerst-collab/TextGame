    Bleistift in anderer Handschrift: „Die Fremde fragte nach der Mühle und nach dem Grab des Müllers.
    In der Nacht ging sie hinaus in den Regen. Am Morgen war das Zimmer leer, das Bett unberührt. Seitdem
    erzählen die Leute von der Frau im Regen. Ich sage nichts dazu. Aber sie hatte die Augen von Hannes.“
