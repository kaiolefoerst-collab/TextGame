    assumption: Die Blockade war kein Unfall, sondern Brandts Befehl.
  - id: f_worker_ledger_reference
    fact: Ein Arbeiter notierte, das Mädchen von der Mühle habe alles in Hannes’ Buch geschrieben.
    assumption: Im Geschäftsbuch der Mühle steht ein Eintrag des Mädchens.
