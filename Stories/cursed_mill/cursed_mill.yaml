  initialPartOf: []
  presentation: {}
  messages:
    Im Kreis: |-
      Du folgst dem Weg aus dem Dorf hinaus. Der Nebel wird dichter, das Pflaster weicher, deine Schritte leiser. Nach einer Weile tauchen vor dir Fachwerkhäuser auf. Ein Platz. Ein Gedenkstein.

      Du bist im Kreis gegangen. Obwohl der Weg schnurgerade war.
    Wieder im Kreis: Wieder der Dorfplatz. Der Nebel lässt dich nicht gehen.
    Abschied: |-
      Später wirst du versuchen, Mühlbach auf einer Karte zu finden. Du wirst es nicht finden.

      Aber du wirst dich erinnern. An einen Gedenkstein, auf dem eine Lüge steht, und an ein Holzkreuz an einer Friedhofsmauer, an dem jetzt ein Brief liegt. An Hannes Voss, der seine Mühle opferte und seinen guten Namen dazu. An Clara, die überlebte und zu spät zurückkam. Und an Richard Brandt, der die Wahrheit kannte und mit ihr allein blieb, bis der Nebel ihn nicht mehr hergab.

      Die Wahrheit lag im Wasser. Jetzt liegt sie bei dir.
