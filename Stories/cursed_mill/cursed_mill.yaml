      BEKANNTMACHUNG DES GEMEINDERATS

      Dem Müller Hannes Voss, durch dessen Schuld die Flut über Mühlbach kam, ist im Ort weder Arbeit noch Brot zu geben. Wer ihm hilft, stellt sich gegen die Gemeinde.

      Für den Gemeinderat:
      Richard Brandt, Vorsitzender
