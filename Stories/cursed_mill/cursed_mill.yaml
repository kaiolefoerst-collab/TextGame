  presentation:
    firstView: |-
      Der Weg fällt steil zum Fluss ab. Unten steht die Mühle, oder was die Flut von ihr übrig gelassen hat. Die flussabgewandte Seite ist aufgerissen, als wäre etwas Gewaltiges von innen nach außen gebrochen. Balken ragen wie Rippen in den Nebel.

      Das große Wasserrad hängt schief in seiner Achse und bewegt sich nicht, obwohl der Fluss darunter rauscht. Drinnen steht noch ein vermoderter Schreibtisch. Eine schmale Treppe führt hinunter in die Radkammer. Dort unten ist es vollkommen dunkel.
