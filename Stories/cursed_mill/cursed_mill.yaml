    text: |-
      Du setzt die Brechstange in den Spalt und stemmst dich dagegen. Das Holz ächzt. Einmal, zweimal, dann gibt die Tür mit einem Knall nach, und ein Schwall kalter, abgestandener Luft schlägt dir entgegen.

