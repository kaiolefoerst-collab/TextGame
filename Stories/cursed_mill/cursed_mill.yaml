  cutscene:
    onlyOnce: true
    buttonLabel: Weiter
    text: |-
      Diesmal trägt dich der Weg. Mit jedem Schritt wird der Nebel dünner, und zum ersten Mal hörst du wieder etwas anderes als Wasser: einen Vogel, dann den Wind in den Bäumen.

      Am Ortsschild bleibst du stehen und schaust zurück. Über dem Tal liegt nur noch ein heller Schleier. Darunter, klein und grau, die Mühle am Fluss.

      Die Glocke schweigt.
    image: Blick von einem Hang zurück in ein bewaldetes Flusstal. Im Vordergrund am Wegrand ein schiefes,
      verwittertes Ortsschild aus Blech auf einem Holzpfosten, von hinten gesehen. Der Nebel liegt nur
      noch als heller, dünner Schleier über dem Tal, der Himmel ist hell bedeckt. Unten im Tal klein ein
      verlassenes Dorf aus Fachwerkhäusern, eine kleine Kapelle aus grauem Bruchstein mit einem schmalen
      Glockentürmchen und Schieferdach und am Fluss die Ruine einer Wassermühle mit schiefem Wasserrad.
      Ausnahmsweise heller und ruhiger als alle anderen Bilder, melancholisch, ein Hauch von Erleichterung.
- id: gasthaus
  name: Gasthaus Zum Mühlrad
  type: location
  physical: true
  layers:
  - present
  locatedIn: null
  initialState:
    visible: true
  initialPartOf: []
  presentation:
    firstView: |-
      Die Tür steht einen Spalt offen. Drinnen riecht es nach kaltem Rauch und nassem Holz. Die Stühle stehen umgedreht auf den Tischen, als hätte der Wirt nur kurz zugesperrt und wäre nie zurückgekommen.

      Auf der Theke liegt ein aufgeschlagenes Gästebuch. Dahinter hängt eine alte Laterne an einem Haken. Neben der Tür ist ein vergilbter Aushang an die Wand genagelt.
    repeatView: Die stille Gaststube.
  image: 'Die Gaststube eines verlassenen Dorfgasthauses: dunkle Holzdielen, schwere Holztische, auf denen
    umgedrehte Stühle stehen. Eine lange hölzerne Theke, darauf ein aufgeschlagenes dickes Buch. Hinter
    der Theke hängt an einem Haken eine schwarze Sturmlaterne aus Blech mit Glaszylinder und Drahtbügel,
    nicht angezündet. Neben der Eingangstür ein vergilbter Papierzettel, mit vier Nägeln an die Holzwand
    geschlagen. Die Tür steht einen Spalt offen, draußen Nebel. Fahles Licht durch beschlagene Fenster,
    Staub.'
