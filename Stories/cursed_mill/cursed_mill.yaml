#              enableTrigger[elementId,triggerId], finishGame

header:
  id: cursed_mill
  title: Die verfluchte Mühle
  author: Kai Olefoerst
  version: 1
  teaser: Ein Dorf im Nebel, aus dem kein Weg hinausführt. Ein Gedenkstein, der lügt. Und eine Flut, die
    vor vierzig Jahren anders geschah, als alle glauben.
  partOf: null
  chapterIndex: null
  startElement: nebelweg
  narratorVoice: male3
  imageMasterPrompt: |-
    Alle Bilder gehören zu derselben Geschichte und müssen aussehen wie Standbilder aus einem einzigen Film.

    Bildstil: fotorealistisch und filmisch, wie mit einer Kinokamera auf Augenhöhe aufgenommen, natürliche Perspektive, feine Filmkörnung, geringe Schärfentiefe nur bei Nahaufnahmen. Keine Illustration, keine Malerei, kein Comic, keine Fantasy, keine Monster, keine übernatürlichen Erscheinungen. Das Unheimliche entsteht allein durch Leere, Nebel, Licht und Verfall.

    Ort: Mühlbach, ein seit Jahrzehnten verlassenes Dorf in einem bewaldeten Flusstal in Mitteleuropa. Fachwerkhäuser mit dunklem Balkenwerk und Schieferdächern, Wege aus Kopfsteinpflaster oder Kies, Mauern aus grauem Bruchstein. Gebäude, Möbel und Gegenstände stammen aus der ersten Hälfte des 20. Jahrhunderts. Nichts Modernes: keine Autos, keine Stromleitungen, kein Plastik.

    Wetter und Licht, in allen Außenbildern gleich: dichter grauer Nebel, bedeckter Himmel ohne Sonne und ohne Blau. Alles ist nass, aber es fällt kein Regen. Tageszeit unbestimmt, fahles, diffuses Licht ohne harte Schatten. Innenräume sind dämmrig: fahles Tageslicht durch schmutzige Fenster oder Ritzen, Staub in der Luft. Warmes Licht gibt es nur, wenn der Detailprompt eine brennende Laterne ausdrücklich nennt.

    Farben: entsättigt und einheitlich gegradet, kühles Grau, Graugrün, Moosgrün, nasses Dunkelbraun, Schwarz. Keine kräftigen Farben.

    Materialien: verwitterter Stein, nasses dunkles Holz, Rost, Moos, Flechten, Schlamm, vergilbtes Papier. Alles ist alt und verfallen, aber glaubwürdig.

    Personen: Niemals Menschen, Gestalten, Silhouetten, Hände oder Gesichter, auch nicht schemenhaft im Hintergrund. Einzige Ausnahme ist ein gemaltes Porträt, wenn der Detailprompt es ausdrücklich verlangt.

    Schrift: Lesbare Schrift erscheint nur, wenn der Detailprompt den Wortlaut in Anführungszeichen vorgibt, dann genau dieser Wortlaut ohne weitere Wörter. Alle anderen Inschriften und Schriftstücke sind nur als unleserliche Zeilen angedeutet.

    Der Detailprompt beschreibt das Motiv verbindlich und hat Vorrang, wo er von diesen Regeln abweicht.
