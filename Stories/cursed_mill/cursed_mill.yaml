  cutscene:
    onlyOnce: true
    buttonLabel: Weiter
    text: |-
      Du gehst an dem Schild vorbei. Hinter dir schließt sich der Nebel wie ein Vorhang.

      Nach ein paar Dutzend Schritten drehst du dich um. Der Weg, auf dem du gekommen bist, ist verschwunden. Nicht verdeckt. Verschwunden. Wo eben noch die Straße war, steht nur graue, nasse Stille.

      Aus der Ferne schlägt eine Kirchenglocke. Einmal. Dann nichts mehr.
    image: Blick zurück auf einen Kiesweg mit nassem Laub. Wenige Meter hinter dem Betrachter endet der
      Weg abrupt in einer undurchdringlichen, gleichmäßig grauen Nebelwand. Kein Horizont, keine Bäume,
      nur Grau. Am Rand der Nebelwand ist ein schiefes, verwittertes Ortsschild aus Blech auf einem Holzpfosten,
      von hinten gesehen, nur noch als schwacher Umriss zu erahnen.
- id: village_square_present
  name: Dorfplatz von Mühlbach
  type: location
  physical: true
  layers:
  - present
  locatedIn: null
  initialState:
    visible: true
  initialPartOf: []
  presentation:
    firstView: |-
      Ein kleiner Platz, gesäumt von Fachwerkhäusern mit eingesunkenen Dächern. Hinter den blinden Fenstern rührt sich nichts. Auf dem Pflaster liegt ein feuchter Film, als hätte es eben erst geregnet. Doch es fällt kein Tropfen.

      In der Mitte steht ein Gedenkstein. Er ist der einzige Stein auf dem ganzen Platz, auf dem kein Moos wächst.

      Wege führen in alle Richtungen: hinunter zum Fluss, wo die Mühle stehen muss, zum Sägewerk, zum Kirchhof und hinauf zu einem großen Haus am Hang. Gegenüber hängt das Schild eines Gasthauses.
    repeatView: Der stille Platz. In der Mitte der Gedenkstein.
  image: Ein kleiner Dorfplatz aus nassem, glänzendem Kopfsteinpflaster, gesäumt von verlassenen Fachwerkhäuser
    mit dunklem, verwittertem Balkenwerk, grau verschmutzten Gefachen, eingesunkenen Schieferdächern und
    blinden Fenstern. In der Mitte des Platzes steht eine schlanke, aufrechte, etwa mannshohe Stele aus
    grauem Granit auf einem quadratischen Sockel, auffallend sauber und ohne Moos; alle anderen Steine
    ringsum sind von Moos überzogen. Am Rand hängt an einem eisernen Ausleger ein verwittertes Wirtshausschild
    mit einem geschnitzten Mühlrad, ohne Schrift. Mehrere Gassen verlieren sich im dichten Nebel, am Hang
    darüber zeichnet sich schwach ein großes Steinhaus ab.
- id: memorial_stone_present
  name: Gedenkstein der Flut
  type: inscription
  physical: true
  layers:
  - present
  locatedIn: village_square_present
  initialState:
    visible: true
  initialPartOf: []
  presentation:
    firstView: Der Stein ist sauber, als würde ihn jemand jede Woche abwaschen. Die Inschrift ist tief
      und ordentlich gemeißelt. Darunter hat jemand später einen Satz in den Stein gekratzt, mit unruhiger
      Hand und einem Werkzeug, das dafür nicht gemacht war. Auf dem Sockel steht klein der Name des Stifters.
    repeatView: 'Der Gedenkstein:'
    contentText: |-
      ZUM GEDENKEN AN CLARA VOSS,
      die in der großen Flut ihr junges Leben verlor.
      Verursacht durch die schuldhafte Bedienung des Mühlenwehrs
      durch ihren Vater Hannes Voss.

      Später eingekratzt:
      „Die Wahrheit liegt noch immer im Wasser.“

      Auf dem Sockel:
      Gestiftet von Richard Brandt
  fragments:
  - id: f_memorial_text
    fact: Der Gedenkstein nennt Clara Voss als Opfer der Flut und ihren Vater Hannes als Schuldigen.
    assumption: Der Müller hat die Katastrophe verursacht, bei der seine eigene Tochter starb.
  - id: f_memorial_scratched
    fact: 'Unter der Inschrift ist später eingekratzt: „Die Wahrheit liegt noch immer im Wasser.“'
    assumption: Jemand hat der offiziellen Geschichte nicht geglaubt.
  - id: f_memorial_donor
    fact: Gestiftet hat den Stein Richard Brandt.
    assumption: Brandt muss im Dorf ein angesehener Mann gewesen sein.
  onUse:
