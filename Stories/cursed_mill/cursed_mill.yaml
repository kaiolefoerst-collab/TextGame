  image: 'Nahaufnahme: eine schlanke, aufrechte, etwa mannshohe Stele aus grauem Granit auf einem quadratischen
    Sockel, auffallend sauber und ohne Moos, auf nassem, moosbewachsenem Kopfsteinpflaster. Auf der Vorderseite
    tief und ordentlich gemeißelt: „ZUM GEDENKEN AN CLARA VOSS, / die in der großen Flut ihr junges Leben
    verlor. / Verursacht durch die schuldhafte Bedienung des Mühlenwehrs / durch ihren Vater Hannes Voss.“
    Darunter grob und unregelmäßig in den Stein gekratzt: „Die Wahrheit liegt noch immer im Wasser.“ Auf
    dem Sockel klein gemeißelt: „Gestiftet von Richard Brandt“. Im Hintergrund unscharf Fachwerkhäuser
    im Nebel.'
