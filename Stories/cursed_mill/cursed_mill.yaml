  presentation:
    firstView: |-
      Das Sägewerk war einmal das größte Gebäude im Tal. Jetzt steht nur noch die Halle, die Dachbalken schwarz vor Nässe. Die große Bandsäge ist festgerostet, ihr Blatt hängt in der Luft wie ein erstarrtes Grinsen. Hinter der Halle verläuft ein steinerner Kanal, vollgestopft mit Balken und Steinen.

