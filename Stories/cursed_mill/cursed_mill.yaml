- id: nebelweg
  name: Landstraße im Nebel
  type: location
  physical: true
  layers:
  - present
  locatedIn: null
  initialState:
    visible: true
  initialPartOf: []
  presentation:
    firstView: |-
      Seit der Wagen am Waldrand liegen geblieben ist, gehst du zu Fuß. Eine Stunde schon, vielleicht länger. Mit jedem Schritt wird der Nebel dichter.

      Irgendwann hört der Asphalt auf. Unter deinen Schuhen knirschen Kies und nasses Laub. Kein Vogel, kein Wind. Nur das Rauschen von Wasser, irgendwo links von dir im Grau.

      Dann taucht ein schiefes Ortsschild aus dem Nebel auf. Die Buchstaben sind kaum noch zu lesen: Mühlbach.
    repeatView: 'Das schiefe Ortsschild: Mühlbach.'
  image: Eine schmale Landstraße aus Kies und nassem Laub führt geradeaus in dichten grauen Nebel. Links
    neben dem Weg ist im Nebel ein Fluss nur zu erahnen. Rechts am Wegrand steht ein schiefes, verwittertes
    Ortsschild aus Blech auf einem Holzpfosten mit der verblassten Aufschrift „Mühlbach“. Kahle Bäume
    als dunkle Silhouetten im Nebel.
