- id: clara_letter_present
  name: Claras Brief
  type: document
  physical: true
  layers:
  - present
  locatedIn: loose_wall_board_present
  initialState:
    visible: false
  initialPartOf: []
  portable: true
  exitLabel: Brief zusammenfalten
  contentVoice: female1
  presentation:
    firstView: Du schlägst das Wachstuch auseinander. Darin liegt ein gefalteter Brief, trocken und unversehrt.
      Die Schrift ist dieselbe wie im Geschäftsbuch, nur älter und ruhiger.
    repeatView: 'Claras Brief:'
    takeText: Du faltest den Brief zusammen und steckst ihn ein. Er wiegt fast nichts.
    dropText: Du legst Claras Brief ab.
    contentText: |-
      Für den, der noch nach der Wahrheit sucht.

      Ich bin Clara Voss. Ich bin nicht ertrunken.

      In der Nacht der Flut ging ich zu Richard Brandt und verlangte, dass er den Kanal öffnen lässt. Er sperrte mich in den Lagerraum seines Sägewerks und ging. Ich habe an der Tür gekratzt, bis meine Finger bluteten. Draußen stieg das Wasser.

      Mein Vater hat das Notwehr geöffnet. Er hat das Wasser durch unsere Mühle geleitet, damit es nicht über das Dorf kommt. Dann hat er mich mit der Brechstange aus dem Lagerraum geholt.

      Am nächsten Morgen kam Brandt zu uns. Er sagte, wenn ich rede, gibt es bald ein zweites Unglück. Vater hat mich noch in derselben Nacht zu meiner Tante Martha Hartmann in die Stadt gebracht. Er ließ alle glauben, ich sei ertrunken. Und er hat geschwiegen, als sie ihm die Schuld gaben, damit niemand nach mir sucht.

      Zwölf Jahre sind vergangen. Vater ist tot, und ich habe ihn nie wiedergesehen. Ich bin zurückgekommen, um ihm zu sagen, dass ich es weiß. An seinem Grab durfte ich nicht weinen, man hätte mich gehört.

      Was ich vor dem Unwetter gesehen habe, steht auf einer der letzten Seiten in Vaters Geschäftsbuch.

      Bitte erzähl es ihm. Mir hat er nie zuhören können.

      Clara Voss
  fragments:
  - id: f_clara_survived
    fact: Clara schrieb den Brief zwölf Jahre nach der Flut.
    assumption: Clara starb nicht in der Flut.
  - id: f_hannes_rescued_clara
    fact: Clara schreibt, ihr Vater habe das Notwehr geöffnet und sie danach aus Brandts Lagerraum befreit.
    assumption: Hannes rettete in derselben Nacht das Dorf und seine Tochter.
  - id: f_hannes_silence
    fact: Hannes brachte Clara zu ihrer Tante Martha Hartmann und ließ alle glauben, sie sei ertrunken.
    assumption: Hannes nahm die Schuld auf sich, damit Brandt Clara nicht finden konnte.
