#   layers: bekannte Ebenen dieser Geschichte.
#   resolution: globale Abschlussbedingung (Kapitel D05 des Elementkatalogs).
#   elements: alle physischen und reinen Story-Elemente.
# Konditionstypen: stateEquals[elementId,property,value], partOfExists[elementId,target], partOfMissing[elementId,target],
#                  inInventory elementId, notInInventory elementId,
