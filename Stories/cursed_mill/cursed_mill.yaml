  messages:
    Auflösung: |-
      Irgendwo im Tal schlägt die Glocke. Einmal, lang und tief. Dann wird es still, und du merkst, dass sich etwas verändert hat. Der Nebel bewegt sich. Er zieht ab, langsam, wie Wasser, das nach einer Flut zurückweicht.

      Der Weg aus dem Dorf ist frei.
