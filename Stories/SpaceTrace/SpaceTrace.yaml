    text: |-
      Das Bedienfeld reagiert sofort, als hätte es auf mich gewartet. Die Schleusentür gleitet zur Seite, ich trete in die Kammer, und hinter mir schließt sie sich wieder.

      Ein Zischen. Luft strömt herein. Die Anzeige in meinem Visier klettert: Druck normal, Sauerstoff vorhanden, Temperatur vier Grad. Atembar. Kalt, aber atembar.

