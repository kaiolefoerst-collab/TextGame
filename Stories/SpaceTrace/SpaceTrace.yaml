header:
  id: SpaceTrace
  title: Space Trace
  author: Kai Foerst
  version: 1
  teaser: 'Ein verzweifelter Raumschiffpilot macht eine Enddeckung im All '
  partOf: null
  chapterIndex: null
  startElement: start_point
  imageMasterPrompt: "Realistischer, filmischer Science-Fiction-Stil mit einer düsteren, geheimnisvollen\
    \ und atmosphärisch dichten Bildsprache.\n\nDie Spielwelt soll glaubwürdig und technisch funktional\
    \ wirken. Raumschiffe, Innenräume, Maschinen und technische Einrichtungen sind  mit sichtbaren Gebrauchsspuren\
    \ gestaltet. Realistischen Materialien wie Metall, Glas und Kunststoff. Keine übertrieben fantasievollen\
    \ Designs.\n\nDie Beleuchtung ist ein zentrales Gestaltungselement. Dunkle Bereiche, tiefe Schatten,\
    \ indirektes Licht, leuchtende Displays, Kontrolllampen und vereinzelte Lichtquellen erzeugen eine\
    \ geheimnisvolle Atmosphäre. Gezielte Lichtreflexionen und dezente volumetrische Effekte verstärken\
    \ die räumliche Tiefe.\n\nDie Farbpalette ist überwiegend kühl und zurückhaltend, mit dunklen Blau-,\
    \ Grau- und Metalltönen. Warme Lichtquellen, kräftige Akzentfarben und Neonbeleuchtung dürfen gezielt\
    \ eingesetzt werden, um technische Einrichtungen hervorzuheben und interessante visuelle Kontraste\
    \ zu schaffen.\n\nDer Weltraum wirkt weit, dunkel, still und überwältigend. Sterne und Himmelskörper\
    \ werden realistisch dargestellt.\n\nDie Bildkomposition erinnert an einen hochwertigen Science-Fiction-Film.\
    \ Sie vermittelt Einsamkeit, Neugier, Spannung und das Gefühl, ein längst vergessenes Geheimnis zu\
    \ entdecken.\n\nPersonen und menschenähnliche Gestalten dürfen grundsätzlich nicht dargestellt werden,\
    \ es sei denn, sie werden im jeweiligen Detailprompt ausdrücklich verlangt. Räume und Szenen werden\
    \ standardmäßig menschenleer dargestellt.\n\nKeine Comic-Ästhetik, keine stilisierten Illustrationen. "
  narratorVoice: male1
layers:
- id: present
  name: Gegenwart
  description: ''
elements:
- id: start_point
  name: Einleitung
  type: location
  physical: true
  layers:
  - present
  locatedIn: null
  initialState:
    visible: true
  initialPartOf: []
  presentation:
    firstView: |+
      Der Weltraum ist riesig. Und verdammt einsam.

      Eigentlich sollte es ein ganz gewöhnlicher Transportflug werden. Ein paar medizinische Güter von Titan zu einer Forschungsstation weit draußen im Sonnensystem. Langweilig, aber gut bezahlt.

      Doch dann gab es technische Probleme, und seit Wochen treibst du nun durchs All. Der Treibstoff ist fast aufgebraucht, die Vorräte werden knapp und Hilfe ist nicht in Sicht.

      Und genau hier beginnt die Geschichte …


  exitLabel: ''
  image: 'Ein Bild mit einem Weltall Hintergrund. Beeindruckend mit Sternen und Nebeln. Darüber der Schriftzug
    als Titelbeschriebung "Space Trace" '
- id: cockpit_glover_iv
  name: Cockpit Glover IV
  type: location
  physical: true
  layers:
  - present
  locatedIn: null
  initialState:
    visible: false
    location: space
    gelandet: false
  initialPartOf: []
  presentation:
    firstView: |-
      Seit ich vor einigen Monaten von Titan, dem Mond des Saturn, aufgebrochen bin, verfluche ich meine Bereitschaft, mit diesem Mini-Raumschiff eine Solo-Mission zu fliegen. Ein paar Medikamente zu einer Forschungsstation weit draußen im Sonnensystem bringen, ungefähr 65 astronomische Einheiten von der Sonne entfernt. Eine Strecke, auf der man kaum jemandem begegnet, und die Reise sollte ohnehin mehrere Monate dauern. An sich schon eine äußerst langweilige Angelegenheit, aber dann kam noch dieser technische Defekt und jetzt sieht es düster aus.
      Ich sitze hier in meinem Cockpit und starre auf die Anzeigen.

      Die Anzeigen zeigen immer das Gleiche. Geschwindigkeit konstant, der KI-Assistent schweigt sich aus und ich habe keine Lust, ihn was zu fragen. Lebenserhaltungssysteme OK, Richtung stabil, Kurs stimmt. Alles könnte gut sein, wenn da nicht das kleine Problem in der Anzeige oben links wäre, die mich darauf hinweist, dass ich kaum noch Treibstoff habe. Ein kleiner roter Balken, der seit Tagen unverändert auf dem Display steht. Nicht besonders auffällig, aber ich schaue trotzdem ständig hin. Als würde sich dadurch etwas ändern.
    repeatView: Die Anzeigen zeigen immer das Gleiche. Geschwindigkeit konstant, der KI-Assistent schweigt
      sich aus und ich habe keine Lust, ihn was zu fragen. Lebenserhaltungssysteme OK, Richtung stabil,
      Kurs stimmt. Alles könnte gut sein, wenn da nicht das kleine Problem in der Anzeige oben links wäre,
      die mich darauf hinweist, dass ich kaum noch Treibstoff habe. Ein kleiner roter Balken, der seit
      Tagen unverändert auf dem Display steht. Nicht besonders auffällig, aber ich schaue trotzdem ständig
      hin. Als würde sich dadurch etwas ändern.
  onUse:
  - id: reaktion_1
    enabled: true
    conditions: []
    effects:
    - disableSelfTrigger: reaktion_1
  image: Das Cockpit eines Raumschiffes aus Sicht es Piloten. Es ist ein sehr kleines Raumschiff für eine
    Person. Der Fokus liegt auf dem Fenster und der Aussenansicht, vom Cockpit selber ist kaum was zu
    sehen. Die Hände des Piloten sieht man nicht. Aus dem Fenster sieht man  Weltall. Das Bild soll ein
    Gefühl der EInsamkeit und Leere vermitteln. Keine Planeten oder sonstige auffälligen Himmelskörper.
  stateTexts:
  - id: zt_hangar_mit_anzug
    conditions:
    - stateEquals:
      - cockpit_glover_iv
      - location
      - hangar
    - inInventory: raumanzug
    firstView: |-
      Die Glover IV steht still auf der Landeplattform. Vor dem Cockpitfenster liegt der Hangar im roten Notlicht, so weit, dass sich seine Wände im Dunkel verlieren. Die Außensensoren melden: kein Luftdruck, minus 140 Grad.

      Der Tank ist leer. Mit der Glover IV komme ich nirgendwo mehr hin. Wenn ich hier rauswill, dann nur durch dieses Schiff.

      Ich trage meinen Raumanzug. Die Schleuse im Laderaum führt hinaus in den Hangar.
    repeatView: Die Glover IV steht im dunklen Hangar des fremden Schiffes. Ich trage meinen Raumanzug,
      durch die Schleuse im Laderaum komme ich hinaus.
  - id: zt_hangar
    conditions:
    - stateEquals:
      - cockpit_glover_iv
      - location
      - hangar
    firstView: |-
      Die Glover IV steht still auf der Landeplattform. Vor dem Cockpitfenster liegt der Hangar im roten Notlicht, so weit, dass sich seine Wände im Dunkel verlieren. Die Außensensoren melden: kein Luftdruck, minus 140 Grad.

      Der Tank ist leer. Mit der Glover IV komme ich nirgendwo mehr hin. Wenn ich hier rauswill, dann nur durch dieses Schiff.

      Ohne Raumanzug verlasse ich die Glover IV allerdings nicht. Den Raumanzug bewahre ich im Laderaum neben den Medikamenten auf.
    repeatView: Die Glover IV steht im dunklen Hangar des fremden Schiffes. Draußen herrscht Vakuum. Ohne
      Raumanzug kann ich nicht hinaus.
  - id: zt_anflug
    conditions:
    - stateEquals:
      - cockpit_glover_iv
      - location
      - approach
    firstView: |-
      Die Nabe des fremden Schiffes liegt direkt vor mir. An ihrer Stirnseite gähnt die offene Hangarbucht, ein rechteckiges Loch in der Panzerung, aus dem trübes Licht fällt. Davor ragt eine Landeplattform ins All. Ihre Leitlichter blinken in einem gleichmäßigen Takt, als hätten sie seit Jahren auf genau diesen Moment gewartet.

      Irgendetwas an Bord hat noch Energie. Die Frage ist nur, was.
    repeatView: Vor dem Cockpitfenster liegt die offene Hangarbucht des fremden Schiffes. Die Leitlichter
      der Landeplattform blinken gleichmäßig.
  - id: zt_neue_spur
    conditions:
    - stateEquals:
      - cockpit_glover_iv
      - location
      - byHope
    firstView: |-
      Inzwischen kann ich es auch durch das Cockpitfenster erkennen. Ein gewaltiges Raumschiff, das langsam vor mir im Dunkel des Weltraums auftaucht. Je näher ich komme, desto deutlicher werden seine Umrisse. Zwei riesige Ringe, mit einer  gemeinsame Achse drehen. Dazwischen unzählige Streben und Verbindungselemente und im Zentrum eine Antriebseinheit.

      Die Ringe bewegen sich nicht und das Schiff scheint einfach nur im Raum zu treiben. Ob dort überhaupt noch jemand lebt?


      Was zum Teufel macht so ein Ding hier draußen und was ist mit Ihm passiert?


      Ich lehne mich zurück und betrachte das gewaltige Gebilde vor mir. Einerseits bin ich unglaublich erleichtert, endlich auf etwas gestoßen zu sein. Andererseits habe ich ein verdammt ungutes Gefühl bei der Sache.
    repeatView: Ich sitze wieder in meinem Cockpit und betrachte das riesige Raumschiff aus dem Cockpitfenster
  stateImages:
  - state:
      location: byHope
    prompt: |+
      Das Cockpit eines Raumschiffes aus Sicht es Piloten. Es ist ein sehr kleines Raumschiff für eine Person. Der Fokus liegt auf dem Fenster und der Aussenansicht, vom Cockpit selber ist kaum was zu sehen. Aus dem Fenster sieht man  Weltall und einer  Ein gewaltiges Raumschiff bestehend aus zwei riesige Ringe, mit einer  gemeinsame Achse drehen. Dazwischen unzählige Streben und Verbindungselemente und im Zentrum eine Antriebseinheit.

  - state:
      location: approach
    prompt: Das Cockpit eines sehr kleinen Ein-Personen-Raumschiffs aus Sicht des Piloten, vom Cockpit
      selbst ist kaum etwas zu sehen. Keine Hände, keine Personen. Durch das Fenster blickt man aus nächster
      Nähe auf die Stirnseite der Nabe eines gigantischen Raumschiffs. Darin eine offene, rechteckige
      Hangarbucht, aus der trübes Licht fällt. Davor ragt eine Landeplattform ins All, gesäumt von kleinen,
      blinkenden Leitlichtern. Die Panzerung ist zerkratzt und von Mikrometeoriten gezeichnet.
  - state:
      location: hangar
    prompt: Das Cockpit eines sehr kleinen Ein-Personen-Raumschiffs aus Sicht des Piloten, vom Cockpit
      selbst ist kaum etwas zu sehen. Keine Hände, keine Personen. Durch das Fenster blickt man in einen
      riesigen, dunklen Hangar im roten Notlicht. Die Wände verlieren sich im Schatten, an Streben und
      Kanten glitzern Eiskristalle. Auf dem Boden eine Reihe grüner Leitlichter.
