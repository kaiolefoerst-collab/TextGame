  initialPartOf: []
  presentation:
    firstView: |-
      An jeder Kapsel klebt ein Namensschild. Okonkwo. Lindqvist. Haddad. Drei Kapseln mit dem Namen Varga, zwei davon kaum länger als ein Kind.

      Bei zwölf Kapseln leuchtet das Licht rot. Ihre Sichtfenster sind dunkel. Ich schaue nicht hinein.
