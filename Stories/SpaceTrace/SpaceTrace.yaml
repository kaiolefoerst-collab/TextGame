    firstView: Das sind Erste-Hilfe-Kits. Sie enthalten Verbandsmaterial, Schmerzmittel, entzündungshemmende
      Präparate, Aufputschmittel und einiges mehr. Alles in allem recht nützlich bei den unterschiedlichsten
