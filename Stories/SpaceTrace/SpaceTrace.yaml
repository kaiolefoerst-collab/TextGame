    repeatView: 'Der letzte Eintrag im Logbuch der Hope:'
    contentText: |-
      Logbuch der Hope. Kapitän Ruben Thal.

      Der Hauptreaktor ist verloren. Mara sagt, der Notreaktor hält die Kapseln am Leben, wenn niemand sonst ihm Energie abzieht. Acht wache Menschen ziehen Energie ab. Wärme, Luft, Licht.

      Wir haben abgestimmt. Wir nehmen beide Shuttles und verlassen die Hope noch heute. Die 340 bleiben in ihren Kapseln.

      Möge man uns eines Tages verzeihen.
