  initialPartOf: []
  presentation:
    firstView: |-
      Der Schlafring krümmt sich vor mir nach oben, bis er hinter seiner eigenen Biegung verschwindet. Kapsel an Kapsel liegen die Schlafenden in langen Reihen, jede mit einem kleinen Licht. Die meisten leuchten grün.

      Es ist bitterkalt. Außer dem leisen Summen der Kühlaggregate ist nichts zu hören.

      Am Eingang des Rings steht die Kälteschlafkonsole.
    repeatView: Die Kapselreihen im kalten Licht.
