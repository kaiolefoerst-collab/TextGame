      An einer Wand ist ein Schlafsack festgeschnallt, daneben steht eine Werkbank. Hier hat jemand gewohnt. Lange.
    repeatView: Der warme Maschinenraum. Der Notreaktor brummt, an der Wand hängt der festgeschnallte
