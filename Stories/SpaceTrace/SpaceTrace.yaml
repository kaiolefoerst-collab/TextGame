      Der Notreaktor ist kaum größer als ein Kühlschrank. Seine Brennstoffanzeige steht auf zwei Prozent.

      Auf die Verkleidung hat jemand mit Filzstift Striche gemalt. Hunderte, in Fünfergruppen, Reihe um Reihe. Ein Kalender. Die ersten Reihen sind gerade und sauber. Die letzten Striche zittern.
