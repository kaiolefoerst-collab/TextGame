    text: |-
      Ich schließe das innere Schott hinter mir. Die Pumpen saugen die Luft ab, das Zischen wird leiser und verstummt. Dann gleitet die Außenluke auf.

      Vor mir liegt der Hangar. Kalt, still, riesig. In der Schwerelosigkeit treibt Staub durch das Licht meiner Helmlampe. Ich setze den ersten Schritt auf die Plattform, und die Magnetstiefel greifen mit einem dumpfen Ruck.
    image: Blick aus der geöffneten Außenluke einer kleinen Raumschiffschleuse hinaus in einen riesigen,
