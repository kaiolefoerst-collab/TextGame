      Die Hope. Natürlich. Jedes Kind auf Titan kennt diesen Namen. Ich war noch klein, als sie aufbrach, und ich weiß noch, wie die halbe Stadt am Raumhafen stand und zum Himmel schaute. Fünf Jahre später brach der Kontakt ab. Reaktorunfall, hieß es. Keine Überlebenden. Es gab eine Gedenkfeier, und irgendwann sprach niemand mehr darüber.

      Aber dieses Schiff ist nicht zerstört. Es hat Energie. Und es hat mich hereingelassen.
