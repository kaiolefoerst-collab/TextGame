    - setCurrentElement: cockpit_glover_iv
  cutscene:
    onlyOnce: true
    text: |-
      Ich nehme Fahrt raus und richte die Glover IV an den Leitlichtern aus. Die Treibstoffanzeige springt auf Rot und dann auf null, genau in dem Moment, in dem die Landestützen aufsetzen. Ein dumpfer Schlag geht durch den Rumpf. Magnetklammern rasten ein.

      Hinter mir setzt sich das Hangartor in Bewegung. Lautlos schiebt es sich vor die Sterne, bis nur noch das rote Notlicht des Hangars bleibt.

      Ich habe es geschafft. Ich weiß nur nicht, wohin.
    image: Ein winziges Ein-Personen-Raumschiff (etwa 30 Meter lang, vorne ein Cockpit, dahinter ein fensterloser
      Frachtraum) ist auf einer Landeplattform im Inneren eines riesigen, dunklen Hangars gelandet. Rotes
      Notlicht und eine Reihe grüner Leitlichter auf dem Boden. Im Hintergrund schließt sich ein gewaltiges
      Hangartor und verdeckt die letzten Sterne. Eiskristalle an den Wänden, tiefe Schatten.
    buttonLabel: Weiter
