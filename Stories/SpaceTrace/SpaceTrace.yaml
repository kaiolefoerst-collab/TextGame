    firstView: Die manuelle Steuerung sollte ich besser nicht benutzen. Die Steuerdüsen verbrauchen Treibstoff,
      und davon habe ich kaum noch etwas übrig. Vielleicht ergibt sich ja noch eine Gelegenheit, die letzten
      Reserven sinnvoller einzusetzen, als hier draußen im All eine kleine Spazierfahrt zu unternehmen.
    repeatView: Die manuelle Steuerung ist hier leider völlig nutzlos.
  image: Nahaufnahme der manuellen Flugsteuerung eines Raumschiffs. Ein ergonomischer Steuerjoystick mit
