    - setCurrentElement: cockpit_glover_iv
  cutscene:
    onlyOnce: true
    text: |-
      Ich nehme Fahrt raus und richte die Glover an den Leitlichtern aus. Die Treibstoffanzeige springt auf Rot und dann auf null, genau in dem Moment, in dem die Landestützen aufsetzen. Ein dumpfer Schlag geht durch den Rumpf. Magnetklammern rasten ein.

      Hinter mir setzt sich das Hangartor in Bewegung. Lautlos schiebt es sich vor die Sterne, bis nur noch das rote Notlicht des Hangars bleibt.

      Ich habe es geschafft. Ich weiß nur nicht, wohin.
    image: Die Glover, genau das Raumschiff auf Vorlage 1, ist auf einer Landeplattform im Inneren eines
      riesigen, dunklen Hangars gelandet, die Landestützen ausgefahren, ausgerichtet an einer Reihe grüner
      Leitlichter auf dem Boden. Rotes Notlicht. Im Hintergrund schließt sich ein gewaltiges Hangartor
