- id: manuelle_steuerung
  name: Manuelle Steuerung
  type: feature
  physical: true
  layers:
  - present
  locatedIn: cockpit_glover_iv
  initialState:
    visible: true
  initialPartOf: []
  presentation:
    firstView: Die manuelle Steuerung sollte ich besser nicht benutzen. Die Steuerdüsen verbrauchen Treibstoff,
      und davon habe ich kaum noch etwas übrig. Vielleicht ergibt sich ja noch eine Gelegenheit, die letzten
      Reserven sinnvoller einzusetzen, als hier draußen im All eine kleine Spazierfahrt zu unternehmen.
    repeatView: Die manuelle Steuerung ist hier leider völlig nutzlos.
  image: Nahaufnahme der manuellen Flugsteuerung eines Raumschiffs. Ein ergonomischer Steuerjoystick mit
    mehreren Tasten und Schaltern, fest eingebaut in die Cockpitkonsole. Daneben einige zusätzliche Bedienelemente
    und kleine Statusanzeigen. Der Joystick steht deutlich im Mittelpunkt. Keine Hände oder Personen im
    Bild.
  stateTexts:
  - id: ms_hangar
    conditions:
    - stateEquals:
      - cockpit_glover_iv
      - location
      - hangar
    firstView: Die Steuerdüsen sind verstummt. Die Treibstoffanzeige steht auf null. Mit der manuellen
      Steuerung komme ich nirgendwo mehr hin. Die Glover IV bleibt in diesem Hangar.
    repeatView: Der Tank ist leer. Die Glover IV fliegt nirgendwo mehr hin.
  - id: ms_anflug
    conditions:
    - stateEquals:
      - cockpit_glover_iv
      - location
      - approach
    firstView: Die Landeplattform liegt genau vor mir, keine zweihundert Meter entfernt. Die Treibstoffanzeige
      blinkt. Es reicht für einen einzigen Landeanflug. Einen zweiten Versuch wird es nicht geben.
    repeatView: Die Landeplattform liegt direkt vor mir. Der Treibstoff reicht für genau einen Landeanflug.
  - id: ms_hope
    conditions:
    - stateEquals:
      - cockpit_glover_iv
      - location
      - byHope
    firstView: |-
      Der Autopilot hat mich bis auf etwa zwanzig Kilometer an das fremde Schiff herangebracht und dann abgeschaltet. Für ein Anflugmanöver an ein unbekanntes Objekt fehlen ihm die Daten. Den Rest muss ich selbst fliegen.

      Dafür sind die letzten Treibstoffreserven da. Eine bessere Gelegenheit, sie einzusetzen, wird es nicht geben.
    repeatView: Mit der manuellen Steuerung kann ich näher an das fremde Schiff heranfliegen. Der Treibstoff
      reicht dafür gerade noch.
- id: kommunikationsanlage_2
  name: Kommunikationskonsole
  type: feature
  physical: true
  layers:
  - present
  locatedIn: cockpit_glover_iv
  initialState:
    visible: true
  initialPartOf: []
  presentation:
    firstView: 'Kommunikation ist auch tot. Die würde viele Probleme lösen. '
    repeatView: Funktioniert leider nicht.
  image: Technische Nahaufnahme einer Kommunikationskonsole, die seitlich im Cockpit eines kleinen Ein-Mann-Raumschiffs
    eingebaut ist. Im Mittelpunkt steht die Konsole mit einem kompakten Display, mehreren Bedientasten,
    Drehreglern, Statusleuchten und einem integrierten Lautsprecher. Die Anlage dient der Sprachkommunikation
    sowie dem Senden und Empfangen von Funksignalen. Die einzelnen technischen Details sind deutlich erkennbar.
    Der Bildausschnitt konzentriert sich ausschließlich auf die Kommunikationskonsole und ihre unmittelbare
    Umgebung. Keine Personen oder Hände im Bild.
- id: navigationskonsole
  name: Navigationskonsole
  type: feature
  physical: true
  layers:
  - present
  locatedIn: cockpit_glover_iv
  initialState:
    visible: true
  initialPartOf: []
  presentation:
    firstView: |-
      Das Navigationssystem meiner Glover IV zeigt mir Objekte in der Umgebung des Schiffes als kleine Punkte an. Normalerweise bleibt der Bildschirm leer. Erkannte Objekte kann ich auswählen, nähere Informationen abrufen und als Ziel festlegen. Der Autopilot berechnet dann den Kurs und steuert das Schiff dorthin.

      Moment mal! Was war das? Da hat doch gerade etwas auf dem Bildschirm aufgeleuchtet! Ich beuge mich vor und schaue genauer hin. Tatsächlich! Ein winziger weißer Punkt. Irgendetwas befindet sich da draußen, mitten in der endlosen Leere! Ein Asteroid, Weltraumschrott oder etwas ganz anderes?

      Ich kann meinen Blick kaum von der Anzeige lösen. Zum ersten Mal seit Wochen spüre ich wieder echte Aufregung. Was auch immer sich hinter diesem Punkt verbirgt, ich muss es herausfinden!
    repeatView: 'Auf dem Navigationsdisplay ist ein winziger leuchtender Punkt aufgetaucht. Ich sollte
      der Sache nachgehen. '
  image: Nahaufnahme des Bildschirm und Tastenfeld eines Navigationssystems eines kleinen Raumschiffs.
    Auf der dunklen Anzeige, auf der ein einzelner kleiner, weiß leuchtender Punkt zu erkennen ist. Die
    Darstellung erinnert an ein Radar, jedoch ohne kreisenden Suchstrahl oder rotierenden Sensor. Rund
    um den Bildschirm befinden sich mehrere kleine Bedientasten und Schalter. Eine der Tasten ist deutlich
    mit „Autopilot“ beschriftet. Das Navigationssystem ist fest in die Cockpitkonsole integriert. Die
    Anzeige wirkt funktional und übersichtlich.
  stateTexts:
  - id: nav_hangar
    conditions:
    - stateEquals:
      - cockpit_glover_iv
      - location
      - hangar
    firstView: Die Anzeige ist voller Störungen. Die Wände des Hangars schirmen die Sensoren ab. Ich sehe
      nur noch die Glover IV selbst, einen kleinen Punkt in einem großen, dunklen Nichts.
    repeatView: Im Hangar sind die Sensoren blind. Die Anzeige zeigt nur Störungen.
  - id: nav_anflug
    conditions:
    - stateEquals:
      - cockpit_glover_iv
      - location
      - approach
    firstView: Das fremde Schiff füllt die gesamte Anzeige aus. Die Landeplattform an der Nabe ist als
      blinkendes Rechteck markiert. Eine Kennung sendet das Schiff nicht, und auf meine Rufe antwortet
      niemand.
    repeatView: Die Landeplattform ist als blinkendes Rechteck markiert. Das Schiff sendet keine Kennung.
  - id: nav_hope
    conditions:
    - stateEquals:
      - cockpit_glover_iv
      - location
      - byHope
    firstView: Aus dem weißen Punkt ist ein Schiff geworden. Über zwei Kilometer lang, keine Kennung,
      kein Funkverkehr. Der Autopilot hält respektvollen Abstand. Für den letzten Anflug müsste ich die
      manuelle Steuerung benutzen.
    repeatView: Das fremde Schiff sendet keine Kennung. Näher heran komme ich nur mit der manuellen Steuerung.
