  cutscene:
    onlyOnce: true
    text: |-
      Der Autopilot ist aktiviert. Die Bord-KI hat den Kurs berechnet und die Steuerdüsen geben einen kurzen Schub ab. Auf der Anzeige verändert sich die Flugrichtung ein wenig. Mehr passiert nicht.

      Jetzt heißt es warten. Ich kann nichts weiter tun, als zu hoffen, dass die Berechnungen stimmen.

      Ich starre wieder auf den kleinen weißen Punkt. Vor ein paar Minuten war ich noch überzeugt, dass meine Reise hier draußen enden würde. Jetzt habe ich plötzlich wieder ein Ziel.

      Verdammt, vielleicht komme ich hier doch noch lebend raus!
    image: 'Bild eines kleinen Ein Mann Raumschiffes von aussen wie es durch das weltall fliegt. Vorne
      eine Cockpit, dahinter ein Fensterloser Frachrraum. Das Raumschiff ist ca. 30 Meter Lang und 10
      Meter Breit. '
    buttonLabel: Weiter
- id: anflug_hope
  name: Mit der manuellen Steuerung heranfliegen
  type: door
  physical: true
  layers:
  - present
  locatedIn: manuelle_steuerung
  initialState:
    visible: false
  initialPartOf: []
  presentation: {}
  onUse:
  - id: go_anflug_hope
    enabled: true
    effects:
    - setElementState:
      - cockpit_glover_iv
      - location
      - approach
    - revealElement: landung_hope
    - hideElement: anflug_hope
    - setCurrentElement: cockpit_glover_iv
  cutscene:
    onlyOnce: true
    text: |-
      Ich schalte den Autopiloten ab und lege die Hand an den Steuerknüppel. Ein kurzer Schub, dann noch einer. Die Glover IV gleitet auf das fremde Schiff zu.

      Mit jedem Kilometer wächst es weiter an, bis es das gesamte Cockpitfenster ausfüllt. Die Ringe sind übersät mit Narben von Mikrometeoriten. Nirgendwo brennt ein Fenster.

      Ich folge der Achse bis zur Nabe. Und dort, an ihrer Stirnseite, entdecke ich etwas, womit ich nicht gerechnet habe: eine offene Hangarbucht. Davor eine Landeplattform, gesäumt von schwach blinkenden Leitlichtern.
    image: 'Weltraumszene: ein winziges Ein-Personen-Raumschiff (etwa 30 Meter lang, vorne ein Cockpit,
      dahinter ein fensterloser Frachtraum) nähert sich von hinten einem gigantischen, dunklen Raumschiff
      aus zwei riesigen Ringen auf einer gemeinsamen Achse, verbunden durch unzählige Streben, im Zentrum
      eine Antriebseinheit. Das kleine Schiff wirkt winzig vor dem Koloss, aus seinen Steuerdüsen kommt
      ein kurzer bläulicher Schub. In den Fenstern des großen Schiffes brennt kein Licht.'
    buttonLabel: Weiter
