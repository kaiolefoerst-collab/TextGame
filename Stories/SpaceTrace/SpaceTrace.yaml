- id: laderaum
  name: Laderaum
  type: location
  physical: true
  layers:
  - present
  locatedIn: null
  initialState:
    visible: true
  initialPartOf: []
  presentation:
    firstView: |-
      Im Laderaum stehen die Transportbehälter mit den Medikamenten. Ordentlich verzurrt und völlig uninteressant. Die Temperaturregelung funktioniert wenigstens noch. Ein paar kleine grüne Kontrollleuchten zeigen mir, dass mit der Fracht alles in Ordnung ist. Schön für die Medikamente.

      An der Rückwand liegt die Schleuse, daneben die Halterung für meinen Raumanzug.
  image: 'Das Bild eines kleinen Laderaumen eines Raumschiffes mit etwas Fracht die nicht genauer spezifiert
    ist. Der Raaum ist ca. 10m x 6m groß. '
