    repeatView: ANTENNE VERBUNDEN · GLOVER IV. Der Sender ist bereit für einen Notruf.
  image: Nahaufnahme einer großen, alten Funkanlage auf der Brücke eines Raumschiffs, mit Reglern, Schaltern
