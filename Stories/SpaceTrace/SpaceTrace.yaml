    mit schwarzem Filzstift Hunderte Zählstriche in Fünfergruppen gemalt, die oberen Reihen ordentlich,
    die unteren zittrig. Daneben eine Brennstoffanzeige mit einem fast leeren Balken. Orangefarbene Kontrollleuchten.
    Menschenleer.
- id: maras_notizbuch
  name: Notizbuch an der Werkbank
  type: document
  physical: true
  layers:
  - present
  locatedIn: maschinenraum
  initialState:
    visible: true
    gelesen: false
  initialPartOf: []
  contentVoice: female1
  presentation:
    firstView: 'An der Werkbank ist ein Notizbuch mit Klebeband befestigt, damit es nicht davontreibt.
      Ein echtes Notizbuch aus Papier. Auf dem Umschlag steht: M. Ilves, Technik. Die letzte Seite ist
      an jemanden gerichtet, den die Schreiberin nie getroffen hat.'
    repeatView: 'Maras Notizbuch:'
    contentText: |-
      An dich, wer auch immer du bist.

      Wenn du hier bist, hat die Hoffnung dich hereingelotst. Ich habe ihr beigebracht, jedem Schiff die Bucht 3 zu öffnen und das Tor hinter ihm zu schließen. Entschuldige den Schreck. Ich wollte nur sicher sein, dass du nicht wieder wegfliegst, bevor du das hier gelesen hast.

      Ich bin Mara Ilves, Ingenieurin der Hoffnung. Nach dem Unfall reichte die Energie nicht mehr für alle. Nicht für 340 Schlafende und acht Wache. Ruben und die anderen haben die Hoffnung mit den Shuttles verlassen, damit die Kapseln ihre Energie bekommen. Sie wollten Hilfe holen. Niemand hat je geantwortet. Ich glaube nicht, dass sie angekommen sind.

      Ich bin geblieben. Irgendjemand musste den Notreaktor am Laufen halten.

      Vierzehn Jahre waren es. Jetzt werde ich krank, die Strahlung vom Reaktor. Darum lege ich mich in die Reservekapsel R-1 im Schlafring. Vielleicht kann mir eines Tages jemand helfen.

      Die Hauptantenne ist zerstört, aber der Sender auf der Brücke funktioniert. Er braucht nur eine Antenne. Dein Schiff hat eine. An der Landeplattform von Andockbucht 3 im Hangar gibt es eine Datenkupplung. Verbinde dein Schiff damit, dann kannst du von der Brücke aus senden.

      Bitte. Ruf jemanden.

      Mara
