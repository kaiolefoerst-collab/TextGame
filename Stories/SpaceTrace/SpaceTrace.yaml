      Die Speiche ist ein enger Schacht, dreihundert Meter lang, mit einer Leiter an der Wand. Ohne Schwerkraft gibt es kein Oben und kein Unten, also ziehe ich mich Sprosse für Sprosse voran. Das Licht meiner Helmlampe tanzt über Rohre und Kabelbündel.

      Je weiter ich komme, desto kälter wird es. Auf den Sprossen liegt Raureif. Dann öffnet sich der Schacht, und ich schwebe hinein in den Schlafring.
