  presentation:
    firstView: |-
      Der Hangar ist größer, als es von außen den Anschein hatte. Das rote Notlicht reicht nur ein paar Dutzend Meter weit, dahinter beginnt die Dunkelheit. An den Streben und Kanten hängt Eis.

      Die Glover IV steht klein und verloren auf der Landeplattform. Andere Schiffe sehe ich nicht, die Andockplätze ringsum sind leer.

      Am hinteren Ende des Hangars leuchtet ein einzelnes Bedienfeld neben einer Schleuse. Grün.
