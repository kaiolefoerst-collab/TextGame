  initialPartOf: []
  presentation:
    firstView: |-
      Hinter der Schleuse beginnt ein langer, gerader Korridor, der tief ins Innere der Nabe führt und sich im Dunkel verliert. Die Deckenleuchten flackern und gehen an, eine nach der anderen, als würde das Schiff mir den Weg zeigen.

      Ohne Schwerkraft treiben Dinge durch die Luft: eine Kaffeetasse, ein Stift, ein einzelner Handschuh. Alles, was niemand festgemacht hat.

      „Hallo?“ Meine Stimme klingt dünn in der kalten Luft. Niemand antwortet.

      Schilder an den Wänden zeigen den Weg: Brücke, Maschinenraum, Speiche B zum Schlafring.
    repeatView: Der Korridor führt tief ins Innere der Nabe. In der Luft treiben vergessene Gegenstände.
      Schilder zeigen den Weg zur Brücke, zum Maschinenraum und durch die Speiche zum Schlafring.
  image: Ein langer, gerader Korridor im Inneren eines alten, gigantischen Raumschiffs, der sich in der
