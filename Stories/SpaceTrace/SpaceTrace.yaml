  cutscene:
    onlyOnce: true
    text: |-
      Der Autopilot ist aktiviert. Die Bord-KI hat den Kurs berechnet und die Steuerdüsen geben einen kurzen Schub ab. Auf der Anzeige verändert sich die Flugrichtung ein wenig. Mehr passiert nicht.

      Jetzt heißt es warten. Ich kann nichts weiter tun, als zu hoffen, dass die Berechnungen stimmen.

      Ich starre wieder auf den kleinen weißen Punkt. Vor ein paar Minuten war ich noch überzeugt, dass meine Reise hier draußen enden würde. Jetzt habe ich plötzlich wieder ein Ziel.

      Verdammt, vielleicht komme ich hier doch noch lebend raus!
    image: 'Weltraumszene: die Glover, genau das Raumschiff auf Vorlage 1 mit derselben Form, denselben
      Farben, Markierungen und demselben Schriftzug, fliegt allein durch das leere, tiefschwarze Weltall
      mit Sternen. Aus ihren kleinen Steuerdüsen kommt ein kurzer, bläulicher Schub, die Haupttriebwerke
      sind aus. Weite, Leere, Einsamkeit.'
    buttonLabel: Weiter
    imageRefs:
    - glover_aussen.jpg
- id: anflug_hope
  name: Mit der manuellen Steuerung heranfliegen
  type: door
  physical: true
  layers:
  - present
  locatedIn: manuelle_steuerung
  initialState:
    visible: false
  initialPartOf: []
  presentation: {}
  onUse:
  - id: go_anflug_hope
    enabled: true
    effects:
    - setElementState:
      - cockpit_glover_iv
      - location
      - approach
    - revealElement: landung_hope
    - hideElement: anflug_hope
    - setCurrentElement: cockpit_glover_iv
  cutscene:
    onlyOnce: true
    text: |-
      Ich schalte den Autopiloten ab und lege die Hand an den Steuerknüppel. Ein kurzer Schub, dann noch einer. Die Glover gleitet auf das fremde Schiff zu.

      Mit jedem Kilometer wächst es weiter an, bis es das gesamte Cockpitfenster ausfüllt. Die Ringe sind übersät mit Narben von Mikrometeoriten. Nirgendwo brennt ein Fenster.

      Ich folge der Achse bis zur Nabe. Und dort, an ihrer Stirnseite, entdecke ich etwas, womit ich nicht gerechnet habe: eine offene Hangarbucht. Davor eine Landeplattform, gesäumt von schwach blinkenden Leitlichtern.
    image: 'Weltraumszene: die Glover, das kleine Raumschiff auf Vorlage 1, nähert sich der Hoffnung,
      dem gigantischen Raumschiff auf Vorlage 2. Beide Schiffe sehen genau so aus wie auf ihren Vorlagen.
      Die Glover ist im Vordergrund klein von schräg hinten zu sehen, aus ihren Steuerdüsen kommt ein
      kurzer, bläulicher Schub. Die Hoffnung füllt den Hintergrund: das stillstehende Rad mit äußerem
      und innerem Ring, den Speichen und der Nabe, an deren Stirnseite die offene Hangarbucht schwach
      rötlich leuchtet. Neben der Hoffnung wirkt die Glover winzig. Der Antrieb der Hoffnung ist aus,
      in ihren Fenstern brennt kein Licht, die Ringe sind von Mikrometeoriten vernarbt.'
    buttonLabel: Weiter
    imageRefs:
    - glover_aussen.jpg
    - hoffnung_aussen.jpg
