- id: notruf_senden
  name: Notruf senden
  type: door
  physical: true
  layers:
  - present
  locatedIn: langstreckensender
  initialState:
    visible: false
  initialPartOf: []
  presentation: {}
  messages:
    Antwort: |-
      „Glover, hier Forschungsstation Kuiper Sieben. Wir empfangen Sie klar und deutlich. Wir haben die Hoffnung auf unseren Schirmen. Ein Rettungsschiff mit Brennstoff für Ihren Notreaktor und einem Ärzteteam an Bord startet noch in dieser Stunde. Ankunft in sechs Tagen. Halten Sie durch.“

      Sechs Tage. Der Notreaktor hat neun.

      Ich schwebe zurück in den Schlafring, an den langen Reihen grüner Lichter vorbei, bis zur Reservekapsel R-1. Hinter dem beschlagenen Glas ist ein Gesicht zu erahnen. „Sie kommen, Mara“, sage ich. „Du hast lange genug gewartet.“

      Noch vor Kurzem habe ich im Cockpit gesessen und auf mein Ende gewartet, mit leerem Tank und einer Ladung Medikamente für eine Station am Rand des Sonnensystems. Jetzt werden 329 Menschen wieder aufwachen. Und ein Ärzteteam wird sich über ein paar Kisten Medikamente freuen.

      Die Hoffnung hat ihren Namen am Ende doch verdient.
  onUse:
  - id: notruf
    enabled: true
    effects:
    - showTextFrom: notruf_senden.messages.Antwort
    - finishGame: true
  cutscene:
    onlyOnce: true
    text: |-
      Ich nehme das Mikrofon und spreche langsam, damit jedes Wort ankommt. Mein Name, die Glover, meine Position. Dann die Hoffnung. 340 Menschen im Kälteschlaf, zwölf davon schon verloren. Neun Tage.

      Danach heißt es warten. Ich schwebe vor dem Sender, starre auf das Display und zähle die Minuten, wie ich es schon im Cockpit der Glover getan habe. Nur dass ich diesmal nicht auf mein Ende warte.

      Nach elf Stunden knackt es im Lautsprecher.
    image: 'Weltraumszene: die Hoffnung, genau das Raumschiff auf Vorlage 1, treibt still im tiefschwarzen
      All. Das Rad steht still, der Antrieb ist aus, in den Fenstern brennt kein Licht. Von der Nabe geht
      ein feiner, kaum sichtbarer Funkstrahl in die Weite des Alls hinaus. In der Ferne ein einzelner,
      schwach leuchtender Punkt. Kein anderes Raumschiff ist zu sehen.'
    buttonLabel: Weiter
    imageRefs:
    - hoffnung_aussen.jpg
