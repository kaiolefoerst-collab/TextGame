- id: navigationssystem
  name: Navigationssystem
  type: location
  physical: true
  layers:
  - present
  locatedIn: null
  initialState:
    visible: true
  initialPartOf: []
  presentation:
    firstView: |-
      Das Navigationssystem meiner Glover IV zeigt mir, was sich in der Umgebung des Schiffes befindet. Viel ist das normalerweise nicht. Meistens starre ich auf einen leeren Bildschirm.

      Erkannte Objekte erscheinen als kleine Punkte. Je nach Entfernung und Bewegungsrichtung verändern sie langsam ihre Position auf der Anzeige.

      Moment mal, was ist das? Auf dem Navigationsdisplay ist ein winziger leuchtender Punkt aufgetaucht. Ich schaue genauer hin. Tatsächlich, da ist etwas! Irgendein Objekt, weit draußen im All. Was es ist, kann ich aus dieser Entfernung nicht erkennen. Vielleicht ein Asteroid, vielleicht aber auch etwas ganz anderes. Zum ersten Mal seit einer gefühlten Ewigkeit gibt es etwas anderes zu sehen als die endlose Leere. Ich spüre, wie meine Neugier erwacht. Und plötzlich ist da ein Gedanke, den ich schon fast aufgegeben hatte: Vielleicht komme ich hier doch noch lebend raus.

      Ich kann jeden dieser Punkte auswählen und mir nähere Informationen anzeigen lassen. Außerdem kann ich das Objekt als Ziel markieren und den Autopiloten einen passenden Kurs berechnen lassen.

      Und jetzt ist da tatsächlich ein kleiner weißer Punkt. Mitten im Nirgendwo. Ich habe keine Ahnung, was sich dahinter verbirgt. Vielleicht ist es nur ein nutzloses Stück Weltraumschrott.

      Vielleicht aber auch meine Rettung. Nach all den Wochen, in denen ich nur auf mein Ende gewartet habe, ist dieser winzige Punkt plötzlich alles, was mir noch Hoffnung gibt.
  onUse:
  - id: reaktion_1
    enabled: false
    conditions: []
    effects:
    - disableSelfTrigger: reaktion_1
  image: Heir sieht man den Bildschirm einer Navigationssystems eines kleinen Raumschiffes. Konkret sieht
