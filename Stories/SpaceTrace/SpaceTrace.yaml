- id: notreaktor
  name: Notreaktor
  type: mechanism
  physical: true
  layers:
  - present
  locatedIn: maschinenraum
  initialState:
    visible: true
  initialPartOf: []
  presentation:
    firstView: |-
      Der Notreaktor ist kaum größer als ein Kühlschrank. Seine Brennstoffanzeige steht auf zwei Prozent.

      Auf die Verkleidung hat jemand mit Filzstift Striche gemalt. Hunderte, in Fünfergruppen, Reihe um Reihe. Ein Kalender. Die ersten Reihen sind gerade und sauber. Die letzten Striche zittern.
    repeatView: 'Der Notreaktor brummt. Brennstoff: zwei Prozent. Auf der Verkleidung die Reihen von Strichen,
      die letzten zittrig.'
  image: Nahaufnahme der Verkleidung eines kompakten Reaktors in einem Raumschiff. Auf das Metall sind
    mit schwarzem Filzstift Hunderte Zählstriche in Fünfergruppen gemalt, die oberen Reihen ordentlich,
    die unteren zittrig. Daneben eine Brennstoffanzeige mit einem fast leeren Balken. Orangefarbene Kontrollleuchten.
    Menschenleer.
- id: maras_notizbuch
  name: Notizbuch an der Werkbank
  type: document
  physical: true
  layers:
  - present
  locatedIn: maschinenraum
  initialState:
    visible: true
    gelesen: false
  initialPartOf: []
  contentVoice: female1
  presentation:
    firstView: 'An der Werkbank ist ein Notizbuch mit Klebeband befestigt, damit es nicht davontreibt.
      Ein echtes Notizbuch aus Papier. Auf dem Umschlag steht: M. Ilves, Technik. Die letzte Seite ist
      an jemanden gerichtet, den die Schreiberin nie getroffen hat.'
    repeatView: 'Mara Ilves’ Notizbuch, die letzte Seite:'
    contentText: |-
      An wen auch immer, der das hier liest.

      Wenn du hier bist, hat die Hope dich hereingelotst. Ich habe ihr beigebracht, jedem Schiff die Bucht 3 zu öffnen und das Tor hinter ihm zu schließen. Entschuldige den Schreck. Ich wollte nur sicher sein, dass du nicht wieder wegfliegst, bevor du das hier gelesen hast.

      Ich bin Mara Ilves, Ingenieurin der Hope. Nach dem Unfall reichte die Energie nicht mehr für alle. Nicht für 340 Schlafende und acht Wache. Ruben und die anderen haben die Hope mit den Shuttles verlassen, damit die Kapseln ihre Energie bekommen. Sie wollten Hilfe holen. Niemand hat je geantwortet. Ich glaube nicht, dass sie angekommen sind.

      Ich bin geblieben. Irgendjemand musste den Notreaktor am Laufen halten.

      Vierzehn Jahre waren es. Jetzt werde ich krank, die Strahlung vom Reaktor. Darum lege ich mich in die Reservekapsel R-1 im Schlafring. Vielleicht kann mir eines Tages jemand helfen.

      Die Hauptantenne ist zerstört, aber der Sender auf der Brücke funktioniert. Er braucht nur eine Antenne. Dein Schiff hat eine. An der Landeplattform von Andockbucht 3 im Hangar gibt es eine Datenkupplung. Verbinde dein Schiff damit, dann kannst du von der Brücke aus senden.

      Bitte. Ruf jemanden.

      Mara
  onUse:
  - id: notizbuch_gelesen
    enabled: true
    effects:
    - setElementState:
      - maras_notizbuch
      - gelesen
      - true
    - hideElement: lb_offiziell
    - hideElement: lb_widerspruch_intakt
    - hideElement: lb_geruecht_flucht
    - hideElement: lb_widerspruch_r1
    - revealElement: lb_wahrheit
    - revealElement: lb_mara
    - revealElement: lb_kupplung
    - revealElement: datenkupplung
    - revealElement: kapsel_r1
    - disableSelfTrigger: notizbuch_gelesen
  image: Ein aufgeschlagenes Notizbuch aus Papier, mit Klebeband auf einer Werkbank in einem Maschinenraum
    befestigt. Handschriftliche Zeilen, die zum Ende hin unregelmäßiger werden. Daneben ein Stift an einer
    Schnur und festgeklebtes Werkzeug. Warmes Licht. Menschenleer.
- id: schlafring
  name: Schlafring
  type: location
  physical: true
  layers:
  - present
  locatedIn: null
  initialState:
    visible: true
  initialPartOf: []
  presentation:
    firstView: |-
      Der Schlafring krümmt sich vor mir nach oben, bis er hinter seiner eigenen Biegung verschwindet. Kapsel an Kapsel liegen die Schlafenden in langen Reihen, jede mit einem kleinen Licht. Die meisten leuchten grün.

      Es ist bitterkalt. Außer dem leisen Summen der Kühlaggregate ist nichts zu hören.

      Am Eingang des Rings steht die Kälteschlafkonsole.
    repeatView: Die langen Reihen der Kälteschlafkapseln, die meisten Lichter grün. Am Eingang die Kälteschlafkonsole.
  image: Das Innere eines riesigen, ringförmigen Raumschiffsegments, der Boden krümmt sich in der Ferne
    nach oben. In langen Reihen liegen Hunderte Kälteschlafkapseln mit vereisten Sichtfenstern, an jeder
    ein kleines grünes Licht, einzelne Lichter rot. Bitterkalte Atmosphäre, Frost, feiner Nebel über dem
    Boden, kaltes blaues Licht. Keine Personen sichtbar.
