# Interaktive, eigenständige Adaption der Grundidee von H. P. Lovecrafts "The Outsider".
# Schema und Effekttypen entsprechen der technischen Vorlage cursed_mill.yaml.

header:
  id: the_outsider
  title: Der Außenseiter - Erste Version
  author: Interaktive Adaption nach H. P. Lovecraft
  version: 1
  teaser: >-
    Ein namenloser Bewohner steigt aus einem lichtlosen Gemäuer empor, um zum
    ersten Mal Menschen zu begegnen. Die Spuren des Ortes erzählen jedoch eine
    andere Geschichte über seine Herkunft, sein Gefängnis und sein wahres Wesen.
  partOf: null
  chapterIndex: null
  startElement: lower_hall_present

layers:
  - id: present_ascent
    name: Der Aufstieg
    description: Die Nacht, in der der namenlose Bewohner das unterirdische Gemäuer verlässt.
  - id: forgotten_life
    name: Das vergessene Leben
    description: Das Leben des letzten Erben von Haus Vale vor mehreren Jahrhunderten.
  - id: burial
    name: Tod und Bestattung
    description: Der Tod des Erben und seine Beisetzung in der Familiengruft.
  - id: lost_centuries
    name: Die verlorenen Jahrhunderte
    description: Die lange Zeit zwischen der Bestattung und dem Erwachen des Bewohners.

resolution:
  conditions:
    - partOfExists: [alden_vale_past, alden_identity_story]
    - partOfExists: [alden_vale_past, death_and_burial_story]
    - partOfExists: [alden_vale_past, undead_awakening_story]
    - partOfExists: [vale_manor_past, former_home_story]
    - partOfMissing: [unknown_narrator_past, nameless_prisoner_story]
  effects:
    - setElementState: [case_resolution, visible, true]
    - setElementState: [case_resolution, complete, true]
    - setElementState: [case_outsider, resolved, true]
    - setElementState: [moonlit_road_present, visible, true]
    - showTextFrom: case_resolution.presentation.releaseText

elements:

  # ---------------------------------------------------------------------
  # Teil A - Gegenwart: physische und unmittelbar benutzbare Elemente
  # ---------------------------------------------------------------------

  - id: player
    name: Ich
    type: player
    physical: true
    layers: [present_ascent]
    locatedIn: lower_hall_present
    initialState: {}
    initialPartOf: []
    presentation:
      firstView: Du tastest über deine Kleidung. Der Stoff ist alt, feucht und an mehreren Stellen zerfallen.
      repeatView: Deine Kleidung gibt keinen sicheren Hinweis auf deine Herkunft.

  - id: buried_estate_present
    name: Das lichtlose Gemäuer
    type: area
    physical: true
    layers: [present_ascent]
    locatedIn: null
    image: "Ein riesiges unterirdisches gotisches Gemäuer aus schwarzem, feuchtem Stein, von Kerzen schwach erhellt, überwucherte Wurzeln in den Decken, melancholischer Horror, keine Menschen."
    initialState:
      visible: true
      investigation: open
    initialPartOf: [case_outsider, believed_castle_story]
    presentation:
      firstView: Seit du denken kannst, gibt es nur diese kalten Mauern, die lautlosen Gänge und die Dunkelheit über dir.
      repeatView: Das Gemäuer liegt weiterhin still unter dem Gewicht der Erde.
    fragments:
      - id: f_estate_darkness
        fact: In keinem erreichbaren Raum fällt Tageslicht ein.
        assumption: Das Gebäude liegt tief unter dichtem Wald oder unter der Erde.

  - id: lower_hall_present
    name: Untere Halle
    type: room
    physical: true
    layers: [present_ascent]
    locatedIn: buried_estate_present
    exitLabel: Gemäuer verlassen
    image: "Eine hohe, dunkle Halle aus feuchtem Stein. Erloschene Wandhalter, schwere Vorhänge, Wurzeln zwischen den Deckenplatten und drei abzweigende Gänge."
    initialState:
      visible: true
      investigation: open
      currentHint: Die Bibliothek und die Gruftgalerie können untersucht werden.
    initialPartOf: [case_outsider, believed_castle_story]
    presentation:
      firstView: >-
        Die untere Halle ist so hoch, dass der Schein deiner Kerze die Decke kaum erreicht.
        Braune, verrottete Vorhänge bedecken die Wände. Feuchtigkeit glänzt auf den Steinplatten,
        und aus den angrenzenden Gängen dringt nur das Rascheln kleiner Tiere.
      repeatView: Der Kerzenschein verliert sich erneut in der hohen, schweigenden Halle.
    fragments:
      - id: f_lower_hall_age
        fact: Wurzeln haben mehrere Deckenplatten gesprengt, und alle Stoffe sind weitgehend zerfallen.
        assumption: Seit sehr langer Zeit hat niemand das Gebäude instand gehalten.

  - id: path_lower_to_library
    name: Gang zur Bibliothek
    type: door
    physical: true
    layers: [present_ascent]
    locatedIn: lower_hall_present
    initialState:
      visible: true
    initialPartOf: []
    onUse:
      - id: enter_library
        enabled: true
        effects:
          - setCurrentElement: library_present

  - id: path_lower_to_crypt
    name: Treppe zur Gruftgalerie
    type: door
    physical: true
    layers: [present_ascent]
    locatedIn: lower_hall_present
    initialState:
      visible: true
    initialPartOf: []
    onUse:
      - id: enter_crypt
        enabled: true
        effects:
          - setCurrentElement: crypt_gallery_present

  - id: path_lower_to_tower
    name: Vermauerter Gang zum schwarzen Turm
    type: door
    physical: true
    layers: [present_ascent]
    locatedIn: lower_hall_present
    initialState:
      visible: false
    initialPartOf: []
    presentation:
      firstUse: Hinter einem eingerissenen Wandbehang liegt ein schmaler Gang. Er führt zum Fuß des schwarzen Turms.
      repeatUse: Der freigelegte Gang führt zum schwarzen Turm.
    onUse:
      - id: enter_tower_base
        enabled: true
        effects:
          - setCurrentElement: black_tower_base_present

  - id: library_present
    name: Verfallene Bibliothek
    type: room
    physical: true
    layers: [present_ascent]
    locatedIn: buried_estate_present
    exitLabel: Bibliothek verlassen
    image: "Eine verfallene gotische Bibliothek mit mannshohen Regalen, schimmeligen Büchern, einem leeren ovalen Spiegelrahmen und einem Lesepult unter Staub und Spinnweben."
    initialState:
      visible: true
      investigation: open
      currentHint: Bücher, Familienchronik, leerer Rahmen und Bauplan können untersucht werden.
    initialPartOf: [case_outsider, believed_castle_story]
    presentation:
      firstView: >-
        Bücher füllen die Wände vom Boden bis in die Finsternis über den Regalen. Ihre Seiten sind
        aufgequollen und riechen nach Schimmel. Auf einem Pult liegt eine schwere Chronik; daneben
        hängt ein leerer ovaler Rahmen, dessen Glas restlos entfernt wurde.
      repeatView: Staub und Moder liegen unverändert über den Büchern und dem alten Lesepult.

  - id: moldy_books_present
    name: Schimmelige Bücher
    type: document_collection
    physical: true
    layers: [present_ascent]
    locatedIn: library_present
    voice: Standard
    initialState:
      visible: true
      investigation: open
    initialPartOf: [longing_for_living_world_story]
    presentation:
      firstUse: >-
        Die Bücher erzählen von Sonne, Stimmen, Musik und dicht gedrängten Städten. Du kennst all dies
        nur aus ihren Bildern. Zwischen den Seiten findest du keine Notiz darüber, wer dir Nahrung brachte
        oder weshalb du hier allein aufgewachsen bist.
      repeatUse: Die Bücher beschreiben eine helle, belebte Welt, die du nie mit eigenen Augen gesehen hast.
    fragments:
      - id: f_books_living_world
        fact: Das gesamte Wissen des Bewohners über Menschen und die Außenwelt stammt aus alten Büchern.
        assumption: Außerhalb des Gemäuers muss eine lebendige Welt existieren.
      - id: f_books_no_teacher
        fact: Es gibt keine Erinnerung an einen Lehrer, eine Stimme oder ein Gespräch.
        assumption: Eine unbekannte Person versorgte den Bewohner, ohne sich zu zeigen.
    onUse:
      - id: read_moldy_books
        enabled: true
        effects:
          - discoverFragment: f_books_living_world
          - discoverFragment: f_books_no_teacher
          - revealElement: longing_for_living_world_story
          - revealElement: unseen_caretaker_story
          - setElementState: [moldy_books_present, investigation, complete]
          - disableSelfTrigger: read_moldy_books

  - id: family_chronicle_present
    name: Chronik des Hauses Vale
    type: document
    physical: true
    layers: [present_ascent]
    locatedIn: library_present
    exitLabel: Chronik schließen
    voice: Standard
    image: "Eine schwere, schimmelbefleckte Familienchronik auf einem steinernen Lesepult, mit verblasstem Wappen und vergilbten Seiten."
    initialState:
      visible: true
      investigation: open
    initialPartOf: [vale_family_history]
    presentation:
      firstUse: Du öffnest die Chronik. Die letzten Seiten sind brüchig, aber noch lesbar.
      repeatUse: Die Chronik endet mit Alden Vales Tod und dem Erlöschen der alten Familienlinie.
      contentText: |
        Chronik des Hauses Vale

        Alden Vale, letzter Sohn des Hauses, starb im Winter seines siebenundzwanzigsten Jahres.
        Da kein Erbe verblieb, wurde er nach altem Recht in der Gruft unter dem Familienfriedhof beigesetzt.
        Das Herrenhaus fiel an einen entfernten Zweig der Familie.

        Mit ihm endete die alte Linie von Vale.
    fragments:
      - id: f_chronicle_alden_death
        fact: Alden Vale starb mit 27 Jahren und wurde in der Familiengruft beigesetzt.
        assumption: Sein Grab muss sich in oder unter diesem Gemäuer befinden.
      - id: f_chronicle_line_ended
        fact: Nach Aldens Tod ging das Herrenhaus an entfernte Verwandte über.
        assumption: Das Gemäuer könnte zum früheren Besitz der Familie Vale gehören.
    onUse:
      - id: read_family_chronicle
        enabled: true
        effects:
          - discoverFragment: f_chronicle_alden_death
          - discoverFragment: f_chronicle_line_ended
          - revealElement: alden_vale_past
          - revealElement: vale_family_past
          - revealElement: vale_family_history
          - revealElement: death_and_burial_story
          - addPartOf: [alden_vale_past, death_and_burial_story]
          - addPartOf: [vale_family_past, vale_family_history]
          - setElementState: [family_chronicle_present, investigation, complete]
          - disableSelfTrigger: read_family_chronicle

  - id: empty_mirror_frame_present
    name: Leerer Spiegelrahmen
    type: object
    physical: true
    layers: [present_ascent]
    locatedIn: library_present
    initialState:
      visible: true
      investigation: open
    initialPartOf: [case_outsider]
    presentation:
      firstUse: >-
        Im Rahmen sitzen noch einzelne dunkle Splitter. Die glatte Fläche wurde nicht durch einen Schlag
        zerstört; Glas und Halterungen sind sorgfältig entfernt worden. Auch in den übrigen Räumen gibt es
        keine spiegelnde Fläche.
      repeatUse: Das Spiegelglas wurde absichtlich und vollständig aus dem Rahmen entfernt.
    fragments:
      - id: f_mirror_removed
        fact: Das Spiegelglas wurde sorgfältig aus dem Rahmen ausgebaut.
        assumption: Jemand wollte verhindern, dass der Bewohner sein eigenes Spiegelbild sieht.
    onUse:
      - id: inspect_empty_mirror
        enabled: true
        effects:
          - discoverFragment: f_mirror_removed
          - revealElement: question_missing_mirrors
          - setElementState: [empty_mirror_frame_present, investigation, complete]
          - disableSelfTrigger: inspect_empty_mirror

  - id: tower_plan_present
    name: Brüchiger Bauplan
    type: document
    physical: true
    layers: [present_ascent]
    locatedIn: library_present
    voice: Standard
    initialState:
      visible: true
      investigation: open
    initialPartOf: [buried_tomb_truth]
    presentation:
      firstUse: >-
        Der Plan zeigt einen schwarzen Rundturm, dessen Treppe zu einer höher gelegenen Kammer führt.
        Ein schmaler Zugang beginnt hinter dem Wandbehang in der unteren Halle.
      repeatUse: Der Bauplan bezeichnet den verborgenen Zugang hinter dem Wandbehang in der unteren Halle.
      contentText: |
        Gruftanlage des Hauses Vale

        Untere Halle — Bibliothek — Sarggalerie
        Aufstieg durch den schwarzen Rundturm zur oberen Grabkammer
        Ausgang zum Familienfriedhof
    fragments:
      - id: f_plan_tower_route
        fact: Ein verborgener Gang in der unteren Halle führt zum schwarzen Turm und von dort nach oben.
        assumption: Der Turm könnte einen Ausgang aus dem Gemäuer bieten.
      - id: f_plan_calls_crypt
        fact: Der Bauplan bezeichnet die Räume ausdrücklich als Gruftanlage.
        assumption: Das vermeintliche Schloss könnte in Wahrheit ein unterirdisches Grabgebäude sein.
    onUse:
      - id: read_tower_plan
        enabled: true
        effects:
          - discoverFragment: f_plan_tower_route
          - discoverFragment: f_plan_calls_crypt
          - revealElement: path_lower_to_tower
          - revealElement: black_tower_base_present
          - revealElement: underground_crypt_past
          - revealElement: buried_tomb_truth
          - revealElement: contradiction_castle_or_tomb
          - addPartOf: [believed_castle_story, contradiction_castle_or_tomb]
          - addPartOf: [buried_tomb_truth, contradiction_castle_or_tomb]
          - setElementState: [lower_hall_present, currentHint, "Hinter dem Wandbehang in der unteren Halle liegt der Zugang zum schwarzen Turm. Du kannst die untere Halle untersuchen."]
          - setElementState: [tower_plan_present, investigation, complete]
          - disableSelfTrigger: read_tower_plan

  - id: path_library_to_lower
    name: Gang zurück zur unteren Halle
    type: door
    physical: true
    layers: [present_ascent]
    locatedIn: library_present
    initialState:
      visible: true
    initialPartOf: []
    onUse:
      - id: leave_library
        enabled: true
        effects:
          - setCurrentElement: lower_hall_present

  - id: crypt_gallery_present
    name: Gruftgalerie
    type: room
    physical: true
    layers: [present_ascent]
    locatedIn: buried_estate_present
    exitLabel: Gruftgalerie verlassen
    image: "Ein unterirdischer Gang mit steinernen Sarkophagen, leeren Wandnischen, bleichen Knochen und flachen Reliefs im schwachen Kerzenlicht."
    initialState:
      visible: true
      investigation: open
      currentHint: Sarkophag, Namensplatte, Wandrelief und Versorgernische können untersucht werden.
    initialPartOf: [case_outsider, buried_tomb_truth]
    presentation:
      firstView: >-
        Niedrige Steinbögen tragen das Gewicht des Gemäuers. In den Wänden stehen lange Marmorkästen,
        einige geschlossen, andere aufgebrochen. Zwischen bleichen Knochen führen deine Fußspuren durch
        jahrzehntealten Staub zu einem geöffneten Sarkophag.
      repeatView: Deine Spuren enden weiterhin am geöffneten Sarkophag der Gruftgalerie.

  - id: empty_sarcophagus_present
    name: Geöffneter Sarkophag
    type: container
    physical: true
    layers: [present_ascent]
    locatedIn: crypt_gallery_present
    exitLabel: Sarkophag schließen
    image: "Ein geöffneter schwarzer Marmorsarkophag, innen zerfallene Seide und eine körperförmige Vertiefung, Staub auf dem Boden davor."
    initialState:
      visible: true
      investigation: open
    initialPartOf: [death_and_burial_story]
    presentation:
      firstUse: >-
        Im Sarkophag liegt kein Leichnam. Zerfallene Seide zeichnet noch die Form eines Körpers nach.
        Der Deckel wurde von innen verschoben; frische Schleifspuren führen über den staubigen Rand.
      repeatUse: Der leere Sarkophag wurde von innen geöffnet. Deine eigenen Spuren beginnen unmittelbar davor.
    fragments:
      - id: f_sarcophagus_empty
        fact: Der Sarkophag ist leer, obwohl seine Innenverkleidung lange einen Körper umschloss.
        assumption: Der Bestattete wurde entfernt oder verließ den Sarkophag aus eigener Kraft.
      - id: f_tracks_from_sarcophagus
        fact: Die einzigen frischen Spuren der Gruft beginnen am geöffneten Sarkophag und entsprechen den Spuren des Bewohners.
        assumption: Der Bewohner könnte in der Nähe des Sarkophags erwacht sein.
    onUse:
      - id: inspect_empty_sarcophagus
        enabled: true
        effects:
          - discoverFragment: f_sarcophagus_empty
          - discoverFragment: f_tracks_from_sarcophagus
          - revealElement: question_empty_sarcophagus
          - revealElement: contradiction_living_or_dead
          - addPartOf: [death_and_burial_story, question_empty_sarcophagus]
          - addPartOf: [nameless_prisoner_story, contradiction_living_or_dead]
          - addPartOf: [death_and_burial_story, contradiction_living_or_dead]
          - setElementState: [empty_sarcophagus_present, investigation, complete]
          - disableSelfTrigger: inspect_empty_sarcophagus

  - id: sarcophagus_plaque_present
    name: Namensplatte am Sarkophag
    type: inscription
    physical: true
    layers: [present_ascent]
    locatedIn: crypt_gallery_present
    voice: Standard
    initialState:
      visible: true
      investigation: open
    initialPartOf: [alden_vale_past, death_and_burial_story]
    presentation:
      firstUse: Unter dem Staub erscheint eine kurze Inschrift.
      repeatUse: Die Platte nennt Alden Vale und sein Todesjahr.
      contentText: |
        Alden Vale
        Letzter seines Hauses
        1692–1719
    fragments:
      - id: f_plaque_alden
        fact: Der leere Sarkophag wurde für Alden Vale angefertigt, der 1719 starb.
        assumption: Jemand oder etwas hat Aldens sterbliche Überreste aus dem Sarkophag entfernt.
    onUse:
      - id: read_sarcophagus_plaque
        enabled: true
        effects:
          - discoverFragment: f_plaque_alden
          - revealElement: alden_vale_past
          - revealElement: death_and_burial_story
          - addPartOf: [alden_vale_past, death_and_burial_story]
          - setElementState: [sarcophagus_plaque_present, investigation, complete]
          - disableSelfTrigger: read_sarcophagus_plaque

  - id: caretaker_niche_present
    name: Leere Versorgernische
    type: container
    physical: true
    layers: [present_ascent]
    locatedIn: crypt_gallery_present
    exitLabel: Nische schließen
    initialState:
      visible: true
      investigation: open
    initialPartOf: [unseen_caretaker_story]
    presentation:
      firstUse: >-
        In der Nische stehen irdene Krüge und zerfallene Körbe. Die jüngsten Gefäße sind noch immer
        Jahrzehnte alt. Kein Schlafplatz, kein Werkzeug und kein persönlicher Gegenstand weist auf einen
        heimlichen Versorger hin.
      repeatUse: Die Nische enthält nur sehr alte Vorratsgefäße und keine Spur eines gegenwärtigen Versorgers.
    fragments:
      - id: f_no_caretaker_trace
        fact: Es gibt keine Spur einer Person, die den Bewohner in jüngerer Zeit versorgt haben könnte.
        assumption: Die Erinnerung an einen unsichtbaren Versorger könnte falsch sein.
    onUse:
      - id: inspect_caretaker_niche
        enabled: true
        effects:
          - discoverFragment: f_no_caretaker_trace
          - hideElement: unseen_caretaker_story
          - setElementState: [caretaker_niche_present, investigation, complete]
          - disableSelfTrigger: inspect_caretaker_niche

  - id: crypt_wall_relief_present
    name: Relief des Familienfriedhofs
    type: inscription
    physical: true
    layers: [present_ascent]
    locatedIn: crypt_gallery_present
    initialState:
      visible: true
      investigation: open
    initialPartOf: [buried_tomb_truth]
    presentation:
      firstUse: >-
        Das Relief zeigt dieselbe Gruft von außen. Über ihren Gewölben stehen Grabsteine und eine kleine
        Kirche. Der schwarze Turm endet nicht über den Bäumen, sondern unter einer steinernen Grabkammer.
      repeatUse: Das Relief zeigt die gesamte Anlage als unterirdischen Teil eines Familienfriedhofs.
    fragments:
      - id: f_relief_graveyard
        fact: Das Gemäuer wurde als unterirdische Gruft unter einem Friedhof errichtet.
        assumption: Der schwarze Turm führt nicht aus einem Schloss hinaus, sondern aus einem Grab hinauf.
    onUse:
      - id: inspect_crypt_relief
        enabled: true
        effects:
          - discoverFragment: f_relief_graveyard
          - revealElement: buried_tomb_truth
          - revealElement: underground_crypt_past
          - setElementState: [crypt_wall_relief_present, investigation, complete]
          - disableSelfTrigger: inspect_crypt_relief
      - id: reveal_castle_contradiction_from_relief
        enabled: true
        conditions:
          - stateEquals: [believed_castle_story, visible, true]
        effects:
          - revealElement: contradiction_castle_or_tomb
          - addPartOf: [believed_castle_story, contradiction_castle_or_tomb]
          - addPartOf: [buried_tomb_truth, contradiction_castle_or_tomb]
          - disableSelfTrigger: reveal_castle_contradiction_from_relief

  - id: path_crypt_to_lower
    name: Treppe zurück zur unteren Halle
    type: door
    physical: true
    layers: [present_ascent]
    locatedIn: crypt_gallery_present
    initialState:
      visible: true
    initialPartOf: []
    onUse:
      - id: leave_crypt
        enabled: true
        effects:
          - setCurrentElement: lower_hall_present

  - id: signet_ring_present
    name: Siegelring an deiner Hand
    type: object
    physical: true
    layers: [present_ascent]
    locatedIn: player
    initialState:
      visible: true
      investigation: open
    initialPartOf: [question_ring_owner]
    presentation:
      firstUse: >-
        Der schwere Ring sitzt fest an deinem ausgezehrten Finger. Sein Wappen zeigt einen schwarzen Turm
        unter drei Sternen – dasselbe Zeichen, das auf der Chronik und den Grabplatten erscheint.
      repeatUse: Der Ring trägt das Wappen des Hauses Vale und scheint seit sehr langer Zeit an deiner Hand zu sitzen.
    fragments:
      - id: f_ring_vale_crest
        fact: Der Bewohner trägt den Siegelring des Hauses Vale.
        assumption: Er könnte ein Diener, Wächter oder Angehöriger der Familie gewesen sein.
    onUse:
      - id: inspect_signet_ring
        enabled: true
        effects:
          - discoverFragment: f_ring_vale_crest
          - revealElement: question_ring_owner
          - addPartOf: [vale_family_past, question_ring_owner]
          - setElementState: [signet_ring_present, investigation, complete]
          - disableSelfTrigger: inspect_signet_ring

  - id: black_tower_base_present
    name: Fuß des schwarzen Turms
    type: room
    physical: true
    layers: [present_ascent]
    locatedIn: buried_estate_present
    exitLabel: Turm verlassen
    image: "Das Innere eines engen schwarzen Rundturms, dessen steinerne Wendeltreppe nach wenigen Stufen abbricht. Darüber liegen grifflose Steine in völliger Dunkelheit."
    initialState:
      visible: false
      investigation: open
      currentHint: Der gefährliche Aufstieg kann begonnen werden.
    initialPartOf: [case_outsider, buried_tomb_truth]
    presentation:
      firstView: >-
        Der Rundturm ist innen kaum breiter als ein Brunnen. Die Treppe endet nach wenigen Windungen.
        Darüber führen nur vorspringende Steine in die Dunkelheit. Kalte Luft fällt von oben herab und
        trägt einen Geruch mit sich, den du nicht kennst: nasses Gras.
      repeatView: Über der abgebrochenen Treppe fällt weiterhin kalte, nach Gras riechende Luft herab.

  - id: tower_ascent_present
    name: Aufstieg im schwarzen Turm
    type: door
    physical: true
    layers: [present_ascent]
    locatedIn: black_tower_base_present
    initialState:
      visible: true
    initialPartOf: [ascent_to_surface_story]
    presentation:
      firstUse: >-
        Du steigst über die abgebrochene Treppe hinaus. Stein um Stein ziehst du dich durch den engen
        Schacht. Stunden scheinen zu vergehen, bis deine Hände gegen eine schwere Platte stoßen. Mit Kopf
        und Schultern schiebst du sie beiseite und kriechst in eine größere Kammer.
      repeatUse: Der Schacht verbindet den Fuß des schwarzen Turms mit der oberen Grabkammer.
    onUse:
      - id: climb_black_tower
        enabled: true
        effects:
          - revealElement: upper_tomb_present
          - revealElement: ascent_to_surface_story
          - setCurrentElement: upper_tomb_present

  - id: path_tower_to_lower
