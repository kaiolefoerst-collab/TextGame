- id: cockpitfenster
  name: CockpitFenster
  type: feature
  physical: true
  layers:
  - present
  locatedIn: cockpit_glover_iv
  initialState:
    visible: true
  initialPartOf: []
  presentation:
    firstView: |
      Ich schaue aus meinem Cockpitfenster und sehe die Sterne im dunklen Raum. Eigentlich ein beeindruckender Anblick. Millionen kleiner Lichtpunkte auf einem vollkommen schwarzen Hintergrund. Kein Flimmern, keine Atmosphäre, die das Licht verzerrt. Alles gestochen scharf. Nur leider wird auch der schönste Sternenhimmel irgendwann langweilig, wenn man ihn den ganzen Tag vor der Nase hat. Ab und zu versuche ich, bekannte Sternbilder zu erkennen. Funktioniert nur bedingt. Von hier draußen sieht eben manches anders aus.
- id: kommunikationsanlage
  name: Kommunikationsanlage
  type: feature
  physical: true
  layers:
  - present
  locatedIn: cockpit_glover_iv
  initialState:
    visible: true
  initialPartOf: []
  presentation:
    firstView: |
      Kommunikation auch tot. Die würde viele Probleme lösen. Wäre zwar teuer, mich abschleppen zu lassen, aber immerhin würde ich überleben. Da muss man Prioritäten setzen. Ich frage mich gelegentlich, wie hoch wohl die Rechnung für einen solchen Einsatz wäre. Vermutlich mehr, als ich mit diesem Transport verdiene. Aber das ist im Moment wirklich mein kleinstes Problem.
- id: laderaum
  name: Laderaum
  type: room
  physical: true
  layers:
  - present
  locatedIn: null
  initialState:
    visible: true
  initialPartOf: []
  presentation:
    firstView: |
      Im Laderaum stehen die Transportbehälter mit den Medikamenten. Ordentlich verzurrt und völlig uninteressant. Die Temperaturregelung funktioniert wenigstens noch. Ein paar kleine grüne Kontrollleuchten zeigen mir, dass mit der Fracht alles in Ordnung ist. Schön für die Medikamente.
