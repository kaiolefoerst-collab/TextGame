# Der Außenseiter
# Interaktive Bearbeitung nach H. P. Lovecraft.
# Technisches Format gemäß cursed_mill.yaml.
# Diese Fassung erzählt ausschließlich über Räume, Gegenstände und Ereignisse.
# Sie enthält keine Gerüchte, Vermutungen, Fragmente oder Widerspruchselemente.

header:
  id: the_outsider
  title: Der Außenseiter
  author: H. P. Lovecraft – interaktive Bearbeitung
  version: 2
  teaser: >-
    Seit du denken kannst, lebst du allein in einem uralten Schloss, das kein
    Sonnenstrahl erreicht. Nur der schwarze Turm könnte über den endlosen Wald
    hinausführen – hinauf zu Licht, Stimmen und den Menschen aus deinen Büchern.
  partOf: null
  chapterIndex: null
  startElement: lower_hall_present

layers:
  - id: present
    name: Die Nacht des Aufstiegs
    description: Der namenlose Bewohner verlässt sein Schloss und sucht die Welt der Menschen.

resolution:
  conditions:
    - stateEquals: [apparition_present, investigation, complete]
  effects:
    - setElementState: [moonlit_flight_present, visible, true]
    - showTextFrom: apparition_present.presentation.afterRevealText

elements:

  # ---------------------------------------------------------------------
  # Der Bewohner und das Schloss
  # ---------------------------------------------------------------------

  - id: player
    name: Ich
    type: player
    physical: true
    layers: [present]
    locatedIn: lower_hall_present
    initialState: {}
    initialPartOf: []
    presentation:
      firstView: >-
        Du streichst über deine Kleidung. Der Stoff ist schwer, feucht und so alt,
        dass er unter deinen Fingern zu zerfallen droht. Über dein Aussehen hast du
        nie nachgedacht; im ganzen Schloss gibt es keinen Spiegel.
      repeatView: >-
        Deine vermoderte Kleidung verrät dir nichts über deine Herkunft. Du hältst
        dich für jung, weil du so wenige Erinnerungen besitzt.

  - id: ancient_castle_present
    name: Das uralte Schloss
    type: area
    physical: true
    layers: [present]
    locatedIn: null
    image: "Ein unvorstellbar altes, düsteres Schloss mit hohen Decken, dunklen Korridoren, braunen Wandbehängen, Spinnweben und feuchten Steinmauern, gotischer Horror, nur Kerzenlicht."
    initialState:
      visible: true
      investigation: open
    initialPartOf: []
    presentation:
      firstView: >-
        Das Schloss ist unvorstellbar alt und unvorstellbar grauenhaft, voll dunkler
        Gänge und hoher Decken, an denen sich nichts als Spinnweben und Schatten
        entdecken lässt. Nirgendwo dringt Tageslicht herein.
      repeatView: >-
        Das uralte Schloss liegt schweigend im ewigen Zwielicht. In seinen Korridoren
        antwortet dir nur das Echo deiner eigenen Schritte.

  - id: lower_hall_present
    name: Braun verhängte Halle
    type: room
    physical: true
    layers: [present]
    locatedIn: ancient_castle_present
    exitLabel: Schloss verlassen
    image: "Eine riesige, elende Halle mit hohen unsichtbaren Decken, braunen verrotteten Wandbehängen, Spinnweben, nassem Stein und einer einzelnen Kerze. Mehrere dunkle Gänge zweigen ab."
    initialState:
      visible: true
      investigation: open
      currentHint: Bibliothek, tiefe Gewölbe und Burghof können untersucht werden.
    initialPartOf: []
    presentation:
      firstView: |
        In dieser Nacht träumt’ der Baron von Unheil nur;
        Und all seine Kriegergäste mit Schatten und Form
        Von Hex’ und Teufel und großem Grabeswurm
        Gaben lange schlechte Träume ihm.
        – Keats

        Unglücklich ist der, dessen Erinnerung an die Kindheit nichts als Angst und
        Traurigkeit birgt. Bedauernswert ist der, der nur zurückblicken kann auf
        einsame Stunden in riesigen, elenden, braun verhängten Gemächern mit
        irrsinnigen Reihen uralter Bücher.

        Solch ein Los haben die Götter dir beschieden – dir, dem Verwirrten und
        Enttäuschten, dem Unfruchtbaren, dem Gebrochenen. Und doch klammerst du dich
        verzweifelt an jene welken Erinnerungen, wenn dein Verstand für einen
        Augenblick droht, sich darüber hinaus des anderen zu entsinnen.

        Du weißt nicht, wo du geboren wurdest. Du weißt nur, dass du schon immer in
        diesem Schloss gelebt hast. Seine zerfallenden Korridore sind von scheußlicher
        Feuchtigkeit überzogen, und überall herrscht ein widerwärtiger Geruch – wie
        von den aufgehäuften Leichen toter Generationen.

        Vor dir verzweigen sich die Wege zur Bibliothek, zu den tiefen Gewölben und
        hinaus in den Burghof.
      repeatView: >-
        Die braunen Behänge hängen reglos in der feuchten Halle. Der Schein deiner
        Kerze reicht nicht bis zur Decke, und aus den dunklen Gängen kommt kein Laut.

  - id: path_lower_to_library
    name: Gang zur Bibliothek
    type: door
    physical: true
    layers: [present]
    locatedIn: lower_hall_present
    initialState:
      visible: true
    initialPartOf: []
    onUse:
      - id: enter_library
        enabled: true
        effects:
          - setCurrentElement: library_present

  - id: path_lower_to_vaults
    name: Treppe zu den tiefen Gewölben
    type: door
    physical: true
    layers: [present]
    locatedIn: lower_hall_present
    initialState:
      visible: true
    initialPartOf: []
    onUse:
      - id: enter_deep_vaults
        enabled: true
        effects:
          - setCurrentElement: deep_vaults_present

  - id: path_lower_to_courtyard
    name: Tor zum Burghof
    type: door
    physical: true
    layers: [present]
    locatedIn: lower_hall_present
    initialState:
      visible: true
    initialPartOf: []
    onUse:
      - id: enter_castle_grounds
        enabled: true
        effects:
          - setCurrentElement: castle_grounds_present

  - id: path_lower_to_tower
    name: Gang zum schwarzen Turm
    type: door
    physical: true
    layers: [present]
    locatedIn: lower_hall_present
    initialState:
      visible: false
    initialPartOf: []
    presentation:
      firstUse: >-
        Die Sehnsucht nach Licht lässt dir keine Ruhe. Du betrittst den engen Gang,
        der zum einzigen schwarzen Turm führt. Er reicht, so glaubst du, über die
        schrecklichen Bäume hinaus in den unbekannten Himmel.
      repeatUse: Der enge Gang führt zum Fuß des schwarzen Turms.
    onUse:
      - id: enter_black_tower
        enabled: true
        effects:
          - setCurrentElement: black_tower_base_present

  # ---------------------------------------------------------------------
  # Bibliothek
  # ---------------------------------------------------------------------

  - id: library_present
    name: Bibliothek der uralten Bücher
    type: room
    physical: true
    layers: [present]
    locatedIn: ancient_castle_present
    exitLabel: Bibliothek verlassen
    image: "Eine riesige, finstere Bibliothek mit irrsinnigen Reihen uralter modriger Bücher, hohen Regalen, farbigen Bildern, Spinnweben und einem leeren Spiegelrahmen, schwaches Kerzenlicht."
    initialState:
      visible: true
      investigation: open
      currentHint: Bücher, Bilder und leerer Rahmen können untersucht werden.
    initialPartOf: []
    presentation:
      firstView: >-
        Irrsinnige Reihen uralter Bücher verschwinden in der Dunkelheit zwischen den
        Regalen. Viele Einbände sind vom Moder aufgequollen, andere zerfallen schon
        bei der leichtesten Berührung. Farbige Bilder zeigen eine Welt, die heller,
        wärmer und lebendiger ist als alles, was du kennst.
      repeatView: >-
        Die Bücher schweigen in ihren hohen Regalen. Staub, Schimmel und die farbigen
        Abbilder fremder Menschen warten im Kerzenschein.

  - id: ancient_books_present
    name: Reihen modriger Bücher
    type: document_collection
    physical: true
    layers: [present]
    locatedIn: library_present
    voice: Standard
    initialState:
      visible: true
      investigation: open
    initialPartOf: []
    presentation:
      firstUse: |
        Aus diesen Büchern hast du alles gelernt, was du weißt. Kein Lehrer drängte
        oder leitete dich, und du kannst dich nicht erinnern, in all den Jahren je
        eine menschliche Stimme gehört zu haben – nicht einmal deine eigene. Obwohl
        du über das Sprachvermögen gelesen hast, kamst du nie auf den Gedanken,
        selbst laut zu sprechen.

        Irgendwelche Wesen müssen sich um dich und deine Bedürfnisse gekümmert haben,
        doch erinnerst du dich an keine Person außer dir selbst und an keine
        Lebewesen außer den lautlosen Ratten, Fledermäusen und Spinnen. Wer immer dich
        versorgte, muss erschütternd alt gewesen sein, denn deine erste Vorstellung
        von einem lebenden Menschen war die eines höhnischen Abbilds deiner selbst:
        verwachsen, verkümmert und verkommen, ganz so wie das Schloss.

        Die Bücher erzählen dagegen von Stimmen, Musik und fröhlichen Wesen in einer
        sonnenbeschienenen Welt. Stundenlang liest du von Städten, Gärten und offenen
        Himmeln. Mit jeder Seite wächst deine Sehnsucht, eines Tages unter jenen
        Menschen zu wandeln, deren Gesichter du nur aus Bildern kennst.
      repeatUse: >-
        Aus den modrigen Büchern kennst du Sprache, Menschen, Sonne, Mond und Sterne.
        Keine ihrer Seiten erklärt, wer du bist oder weshalb du allein im Schloss lebst.
    onUse:
      - id: read_ancient_books
        enabled: true
        effects:
          - setElementState: [ancient_books_present, investigation, complete]
          - disableSelfTrigger: read_ancient_books
      - id: reveal_tower_after_books
        enabled: true
        conditions:
          - stateEquals: [forest_escape_present, investigation, complete]
        effects:
          - setElementState: [path_lower_to_tower, visible, true]
          - setElementState: [lower_hall_present, currentHint, "Der Gang zum schwarzen Turm ist zugänglich. Du kannst die untere Halle untersuchen."]
          - disableSelfTrigger: reveal_tower_after_books

  - id: colored_illustrations_present
    name: Farbige Bilder der Menschen
    type: document
    physical: true
    layers: [present]
    locatedIn: library_present
    voice: Standard
    initialState:
      visible: true
      investigation: open
    initialPartOf: []
    presentation:
      firstUse: |
        Für dich ist nichts Groteskes an den Gebeinen und Gerippen, die in manchen
        Gewölben des Schlosses verstreut liegen. Du verbindest solche Dinge mit
        alltäglichen Geschehnissen und empfindest sie als natürlicher als die farbigen
        Bilder lebender Wesen in diesen Büchern.

        Rein instinktiv hältst du dich den jugendlichen Gestalten auf den Zeichnungen
        und Gemälden für ähnlich. Du fühlst dich jung, weil du so wenige Erinnerungen
        besitzt. Nie kam dir der Gedanke, daran zu zweifeln.
      repeatUse: >-
        Die Bilder zeigen junge, gesunde Menschen. Du hast immer angenommen, ihnen zu gleichen.
    onUse:
      - id: inspect_colored_illustrations
        enabled: true
        effects:
          - setElementState: [colored_illustrations_present, investigation, complete]
          - disableSelfTrigger: inspect_colored_illustrations

  - id: empty_mirror_frame_present
    name: Leerer Rahmen
    type: object
    physical: true
    layers: [present]
    locatedIn: library_present
    initialState:
      visible: true
      investigation: open
    initialPartOf: []
    presentation:
      firstUse: >-
        Der hohe Rahmen ist leer. Vielleicht trug er einst ein Gemälde; vielleicht
        etwas anderes. Im ganzen Schloss findest du keine glatte Fläche, die dir dein
        eigenes Bild zurückgeben könnte. Über dein Aussehen hast du dir deshalb nie
        Gedanken gemacht.
      repeatUse: Der Rahmen bleibt leer. Im Schloss gibt es keinen Spiegel.
    onUse:
      - id: inspect_empty_frame
        enabled: true
        effects:
          - setElementState: [empty_mirror_frame_present, investigation, complete]
          - disableSelfTrigger: inspect_empty_frame

  - id: path_library_to_lower
    name: Gang zurück zur braun verhängten Halle
    type: door
    physical: true
    layers: [present]
    locatedIn: library_present
    initialState:
      visible: true
    initialPartOf: []
    onUse:
      - id: leave_library
        enabled: true
        effects:
          - setCurrentElement: lower_hall_present

  # ---------------------------------------------------------------------
  # Tiefe Gewölbe
  # ---------------------------------------------------------------------

  - id: deep_vaults_present
    name: Tiefe Steingewölbe
    type: room
    physical: true
    layers: [present]
    locatedIn: ancient_castle_present
    exitLabel: Gewölbe verlassen
    image: "Tiefe uralte Steingewölbe unter einem Schloss, verstreute Knochen und Gerippe, dunkle Wandnischen, längliche Marmorkästen, feuchter Boden, gotischer Horror."
    initialState:
      visible: true
      investigation: open
      currentHint: Gebeine und Marmornischen können untersucht werden.
    initialPartOf: []
    presentation:
      firstView: >-
        Die Treppe führt tief hinab in das Fundament. In den Winkeln liegen Gebeine
        und vollständige Gerippe auf feuchtem Stein. Du empfindest ihren Anblick nicht
        als schrecklich. Sie gehören für dich so selbstverständlich zu diesem Ort wie
        die Ratten, die lautlos zwischen ihnen verschwinden.
      repeatView: >-
        In den tiefen Gewölben liegen die Gebeine unverändert zwischen feuchtem Stein
        und schwarzen Wandnischen.

  - id: scattered_bones_present
    name: Verstreute Gebeine
    type: object_collection
    physical: true
    layers: [present]
    locatedIn: deep_vaults_present
    initialState:
      visible: true
      investigation: open
    initialPartOf: []
    presentation:
      firstUse: >-
        Manche Knochen sind zu Staub zerfallen, andere liegen noch in menschlicher
        Gestalt beieinander. Ihre bleichen Formen erscheinen dir vertrauter als die
        rosigen Gesichter in den Büchern. Du kannst nicht sagen, weshalb.
      repeatUse: Die stillen Gebeine wecken in dir weder Abscheu noch Furcht.
    onUse:
      - id: inspect_scattered_bones
        enabled: true
        effects:
          - setElementState: [scattered_bones_present, investigation, complete]
          - disableSelfTrigger: inspect_scattered_bones

  - id: marble_recesses_present
    name: Tiefe Marmornischen
    type: object_collection
    physical: true
    layers: [present]
    locatedIn: deep_vaults_present
    initialState:
      visible: true
      investigation: open
    initialPartOf: []
    presentation:
      firstUse: >-
        Die Wände enthalten tiefe Nischen aus kaltem Marmor. In einigen stehen
        abscheuliche längliche Kästen von verwirrender Größe. Ihre Deckel sind schwer,
        glatt und ohne erkennbare Griffe. Du hast nie versucht, sie zu öffnen.
      repeatUse: In den Marmornischen ruhen die schweren länglichen Kästen.
    onUse:
      - id: inspect_marble_recesses
        enabled: true
        effects:
          - setElementState: [marble_recesses_present, investigation, complete]
          - disableSelfTrigger: inspect_marble_recesses

  - id: path_vaults_to_lower
    name: Treppe zurück zur braun verhängten Halle
    type: door
    physical: true
    layers: [present]
    locatedIn: deep_vaults_present
    initialState:
      visible: true
    initialPartOf: []
    onUse:
      - id: leave_deep_vaults
        enabled: true
        effects:
          - setCurrentElement: lower_hall_present

  # ---------------------------------------------------------------------
  # Burghof und Wald
  # ---------------------------------------------------------------------

  - id: castle_grounds_present
    name: Dämmeriger Burghof
    type: room
    physical: true
    layers: [present]
    locatedIn: ancient_castle_present
    exitLabel: Burghof verlassen
    image: "Ein fauliger Burggraben und ein dämmeriger Burghof unter grotesken gigantischen Bäumen, deren Ranken und Äste den gesamten Himmel verdecken, schwarzes Schloss im Hintergrund."
    initialState:
      visible: true
      investigation: open
      currentHint: Burggraben, Bäume und Waldweg können untersucht werden.
    initialPartOf: []
    presentation:
      firstView: >-
        Jenseits des Tores liegen ein fauliger Burggraben und dämmerbeschienene Haine
        voller grotesker, gigantischer, von Ranken umschlungener Bäume. Ihre Zweige
        krümmen sich weit über das Schloss und winken lautlos in einer Höhe, die du
        niemals erreichen konntest. Hier draußen scheint ebenso wenig eine Sonne wie
        in den Hallen.
      repeatView: >-
        Die finsteren Bäume stehen stumm über dem fauligen Graben. Kein Wind bewegt
        die Ranken, und kein Stück Himmel ist zwischen den Zweigen zu erkennen.

  - id: putrid_moat_present
    name: Fauliger Burggraben
    type: place
    physical: true
    layers: [present]
    locatedIn: castle_grounds_present
    initialState:
      visible: true
      investigation: open
    initialPartOf: []
    presentation:
      firstUse: >-
        Das schwarze Wasser steht reglos zwischen eingesunkenen Steinen. Oft lagst du
        hier unter den stummen Bäumen und träumtest stundenlang von dem, was du in den
        Büchern gelesen hattest: von offenen Straßen, Stimmen und einer Sonne, die
        nicht bloß ein gemaltes Wort war.
      repeatUse: Das Wasser des Grabens spiegelt nur Äste und Finsternis.
    onUse:
      - id: inspect_putrid_moat
        enabled: true
        effects:
          - setElementState: [putrid_moat_present, investigation, complete]
          - disableSelfTrigger: inspect_putrid_moat

  - id: terrible_trees_present
    name: Groteske Bäume
    type: place
    physical: true
    layers: [present]
    locatedIn: castle_grounds_present
    initialState:
      visible: true
      investigation: open
    initialPartOf: []
    presentation:
      firstUse: >-
        Die Stämme sind so mächtig, dass mehrere Menschen sie kaum umfassen könnten.
        Ranken würgen ihre Rinde, und ihre Äste greifen ineinander wie die Rippen
        eines ungeheuren Tieres. Selbst über dem höchsten zugänglichen Turm bilden sie
        eine geschlossene Decke.
      repeatUse: Die gigantischen Bäume verbergen jeden Blick auf den Himmel.
    onUse:
      - id: inspect_terrible_trees
        enabled: true
        effects:
          - setElementState: [terrible_trees_present, investigation, complete]
          - disableSelfTrigger: inspect_terrible_trees

  - id: forest_escape_present
    name: Weg in den endlosen Wald
    type: door
    physical: true
    layers: [present]
    locatedIn: castle_grounds_present
    initialState:
      visible: true
      investigation: open
    initialPartOf: []
    presentation:
      firstUse: |
        Du unternimmst den Versuch, den Wald zu durchqueren. Doch je weiter du dich
        vom Schloss entfernst, desto tiefer werden die Schatten und desto mehr Furcht
        hängt lauernd in der Luft. Die Stämme schließen sich hinter dir zu einem
        Labyrinth nachtschwarzer Stille.

        Bald weißt du nicht mehr, aus welcher Richtung du gekommen bist. Panik erfüllt
        dich, und du rennst zwischen den stummen Bäumen zurück, bis das schwarze
        Mauerwerk des Schlosses wieder vor dir auftaucht.

        So hast du viele Male im endlosen Dämmerlicht geträumt und gewartet – doch
        worauf du wartetest, das wusstest du nie.
      repeatUse: >-
        Der Wald verdichtet sich schon nach kurzer Strecke zu undurchdringlicher,
        furchterfüllter Nacht. Dieser Weg führt dich nicht hinaus.
    onUse:
      - id: attempt_forest_escape
        enabled: true
        effects:
          - setElementState: [forest_escape_present, investigation, complete]
          - setCurrentElement: castle_grounds_present
          - disableSelfTrigger: attempt_forest_escape
      - id: reveal_tower_after_forest
        enabled: true
        conditions:
          - stateEquals: [ancient_books_present, investigation, complete]
        effects:
          - setElementState: [path_lower_to_tower, visible, true]
          - setElementState: [lower_hall_present, currentHint, "Der Gang zum schwarzen Turm ist zugänglich. Du kannst die untere Halle untersuchen."]
          - disableSelfTrigger: reveal_tower_after_forest

  - id: path_courtyard_to_lower
    name: Tor zurück zur braun verhängten Halle
    type: door
    physical: true
    layers: [present]
    locatedIn: castle_grounds_present
    initialState:
      visible: true
    initialPartOf: []
    onUse:
      - id: leave_castle_grounds
        enabled: true
        effects:
          - setCurrentElement: lower_hall_present

  # ---------------------------------------------------------------------
  # Schwarzer Turm und obere Kammer
  # ---------------------------------------------------------------------

  - id: black_tower_base_present
    name: Fuß des schwarzen Turms
    type: room
    physical: true
    layers: [present]
    locatedIn: ancient_castle_present
    exitLabel: Turm verlassen
    image: "Das Innere eines schwarzen verfallenen Rundturms, eine uralte Steintreppe endet nach wenigen Windungen, darüber ein stufenloser schmaler Steinzylinder mit Fledermäusen."
    initialState:
      visible: true
      investigation: open
      currentHint: Der Aufstieg kann begonnen werden.
    initialPartOf: []
    presentation:
      firstView: |
        In den Schatten der Einsamkeit ist deine Sehnsucht nach Licht so stark
        geworden, dass dir keine Ruhe mehr bleibt. Vor dir erhebt sich der einzige
        schwarze Turm, der über den Wald in den unbekannten Himmel ragt.

        Seine abgetragene Steintreppe endet nach wenigen Windungen. Darüber verläuft
        ein toter, stufenloser Zylinder aus schwarzem Fels. Kleine Vorsprünge führen
        Stein für Stein an der bloßen Wand empor.

        Du fasst den Entschluss, den Turm zu erklimmen – und solltest du dabei
        abstürzen. Es ist besser, einen einzigen Blick auf den Himmel zu erhaschen und
        zu sterben, als zu leben, ohne je das Tageslicht gesehen zu haben.
      repeatView: >-
        Über der abgebrochenen Treppe wartet der schwarze, stufenlose Steinzylinder.

  - id: tower_ascent_present
    name: Die Turmwand erklimmen
    type: door
    physical: true
    layers: [present]
    locatedIn: black_tower_base_present
    initialState:
      visible: true
    initialPartOf: []
    presentation:
      firstUse: |
        Im feuchten Zwielicht steigst du die abgetragene und uralte Steintreppe bis
        dahin empor, wo sie endet. Dann ziehst du dich wagemutig an den kleinen
        Vorsprüngen hinauf. Gespenstisch und grausig ist dieser tote Steinzylinder:
        schwarz, verfallen und verlassen, voller aufgescheuchter Fledermäuse, deren
        Schwingen keinen Laut erzeugen.

        Gespenstischer und grausiger noch ist die Langwierigkeit des Aufstiegs. So
        weit du auch kletterst, die Finsternis über dir will sich nicht lichten. Ein
        neuer Frosthauch wie von heimgesuchtem und uraltem Moder befällt dich. Du
        erschauderst und fragst dich, warum du nicht zum Licht gelangst. Mit einer
        freien Hand tastest du vergeblich nach einer Fensteröffnung, um die erreichte
        Höhe abschätzen zu können.

        Nach unendlich langem, blindem Klettern über dem gewölbten Abgrund stößt dein
        Kopf gegen ein festes Hindernis. Du musst das Dach oder eine Zwischendecke
        erreicht haben. Die Barriere ist aus Stein und zunächst unbeweglich.

        Seitwärts hangelst du dich durch die Rundung des Turmes und krallst dich an
        allem fest, was die schleimbedeckte Mauer dir bietet. Schließlich findet deine
        suchende Hand eine Stelle, an der die Barriere nachgibt. Du stemmst den
        Steindeckel mit dem Kopf empor und setzt deinen angsterfüllten Aufstieg mit
        beiden Händen fort.

        Über dir erscheint kein Licht. Der Deckel öffnet sich auf eine ebene
        Steinfläche von größerem Durchmesser als der Turm – ohne Zweifel der Boden
        einer hohen und geräumigen Aussichtskammer. Du schlängelst dich vorsichtig
        hindurch, doch die schwere Falltür schlägt hinter dir zu.
      repeatUse: Der lange Aufstieg führt zur hohen Kammer über dem schwarzen Turm.
    onUse:
      - id: climb_black_tower
        enabled: true
        effects:
          - setElementState: [upper_structure_present, visible, true]
          - setElementState: [high_chamber_present, visible, true]
          - setCurrentElement: high_chamber_present

  - id: path_tower_to_lower
    name: Gang zurück zur braun verhängten Halle
    type: door
    physical: true
    layers: [present]
    locatedIn: black_tower_base_present
    initialState:
      visible: true
    initialPartOf: []
    onUse:
      - id: leave_black_tower
        enabled: true
        effects:
          - setCurrentElement: lower_hall_present

  - id: high_chamber_present
    name: Hohe Aussichtskammer
    type: room
    physical: true
    layers: [present]
    locatedIn: upper_structure_present
    exitLabel: Aussichtskammer verlassen
    image: "Eine vollkommen dunkle steinerne Kammer über einem Turmschacht, gewaltige Marmornischen mit länglichen Kästen, eine zugeschlagene Bodenplatte und ein reliefverziertes Steinportal."
    initialState:
      visible: false
      investigation: open
      currentHint: Falltür, Marmornischen und Steinportal können untersucht werden.
    initialPartOf: []
    presentation:
      firstView: |
        Erschöpft liegst du auf dem Steinboden und hörst das unheimliche Echo der
        zugeschlagenen Falltür. Du hoffst, sie wieder aufstemmen zu können, sollte es
        nötig sein.

        Da du dich in beträchtlicher Höhe glaubst, weit über den verfluchten Ästen des
        Waldes, erhebst du dich mühsam und tastest nach Fenstern. Zum ersten Mal willst
        du den Himmel, den Mond und die Sterne sehen, von denen du gelesen hast.

        Doch rundherum wirst du enttäuscht. Deine Hände finden keine Fenster, sondern
        gewaltige Nischen aus Marmor, die abscheuliche längliche Kästen von
        verwirrender Größe bergen. Welche grausigen Geheimnisse mögen in diesem hohen
        Raum hausen, der seit unzähligen Jahren vom unteren Schloss abgeschnitten ist?

        Schließlich ertastest du einen Türsturz mit einem steinernen Portal, das mit
        seltsamen Reliefs bedeckt ist.
      repeatView: >-
        Die vermeintliche Aussichtskammer besitzt keine Fenster. Marmornischen,
        Falltür und Steinportal liegen in vollkommener Dunkelheit.

  - id: closed_trapdoor_present
    name: Zugeschlagene Falltür
    type: object
    physical: true
    layers: [present]
    locatedIn: high_chamber_present
    initialState:
      visible: true
      investigation: open
    initialPartOf: []
    presentation:
      firstUse: >-
        Du versuchst, deine Finger unter den Rand zu schieben, doch die Platte bewegt
        sich nicht. Der Schacht, durch den du emporgestiegen bist, bleibt verschlossen.
      repeatUse: Die schwere Steinplatte lässt sich von dieser Seite nicht öffnen.
    onUse:
      - id: inspect_closed_trapdoor
        enabled: true
        effects:
          - setElementState: [closed_trapdoor_present, investigation, complete]
          - disableSelfTrigger: inspect_closed_trapdoor

  - id: upper_marble_boxes_present
    name: Längliche Marmorkästen
    type: object_collection
    physical: true
    layers: [present]
    locatedIn: high_chamber_present
    initialState:
      visible: true
      investigation: open
    initialPartOf: []
    presentation:
      firstUse: >-
        Die Kästen reichen fast über die gesamte Länge der Nischen. Ihre Oberflächen
        sind kalt und glatt; auf manchen lassen sich verwitterte Zeichen ertasten, die
        du nicht lesen kannst. Die Form kommt dir auf dunkle Weise vertraut vor, doch
        dein Verstand weigert sich, diese Vertrautheit zu verfolgen.
      repeatUse: Die länglichen Marmorkästen bleiben in ihren hohen Nischen verschlossen.
    onUse:
      - id: inspect_upper_marble_boxes
        enabled: true
        effects:
          - setElementState: [upper_marble_boxes_present, investigation, complete]
          - disableSelfTrigger: inspect_upper_marble_boxes

  - id: carved_stone_portal_present
    name: Reliefverziertes Steinportal
    type: door
    physical: true
    layers: [present]
    locatedIn: high_chamber_present
    initialState:
      visible: true
    initialPartOf: []
    presentation:
      firstUse: |
        Das steinerne Portal ist verschlossen. Du stemmst dich dagegen, rüttelst an
        ihm und überwindest mit äußerster Anstrengung die unsichtbare Sperre. Langsam
        schabt die Tür nach innen.

        Dahinter liegt ein kurzer steinerner Gang mit einigen Stufen. An seinem Ende
        steht ein kunstfertiges Eisengitter. Durch seine Ornamente strahlt hell und
        friedlich der Vollmond – der erste wirkliche Mond deines Lebens.

        Reinste Ekstase überwältigt dich. Bisher kanntest du dieses Licht nur aus
        Träumen und aus vagen Visionen, die Erinnerungen zu nennen du nicht wagtest.
      repeatUse: Das geöffnete Steinportal führt zum Eisengitter im Mondlicht.
    onUse:
      - id: open_stone_portal
        enabled: true
        effects:
          - setElementState: [moon_gate_present, visible, true]
          - setCurrentElement: moon_gate_present

  # ---------------------------------------------------------------------
  # Mondgitter und Friedhof
  # ---------------------------------------------------------------------

  - id: upper_structure_present
    name: Unbekannter oberer Bau
    type: area
    physical: true
    layers: [present]
    locatedIn: null
    initialState:
      visible: false
      investigation: open
    initialPartOf: []
    presentation:
      firstView: Kalter Stein umschließt die oberen Kammern des schwarzen Turms.
      repeatView: Die oberen Kammern liegen still unter dem Mond.

  - id: moon_gate_present
    name: Kammer am Eisengitter
    type: room
    physical: true
    layers: [present]
    locatedIn: upper_structure_present
    exitLabel: Kammer verlassen
    image: "Ein kurzer steinerner Gang mit wenigen aufwärts führenden Stufen und einem kunstvollen Eisengitter, durch das heller friedlicher Vollmond scheint."
    initialState:
      visible: false
      investigation: open
      currentHint: Das Eisengitter kann geöffnet werden.
    initialPartOf: []
    presentation:
      firstView: |
        Du bist überzeugt, die höchsten Zinnen des Schlosses erreicht zu haben. Die
        wenigen Stufen hinter dem Portal führen zu dem Gitter, vor dem das Mondlicht
        liegt wie eine silberne Verheißung.

        Eine Wolke schiebt sich vor den Mond. Du stolperst und tastest dich langsam
        weiter. Das Gitter ist nicht verschlossen, dennoch wagst du zunächst nicht, es
        zu öffnen. Aus der gewaltigen Höhe, die du erklommen hast, müsstest du in den
        Tod stürzen.

        Dann tritt der Mond wieder hervor.
      repeatView: >-
        Hinter dem unverschlossenen Eisengitter liegt friedliches, silbernes Mondlicht.

  - id: iron_grating_present
    name: Kunstfertiges Eisengitter
    type: door
    physical: true
    layers: [present]
    locatedIn: moon_gate_present
    initialState:
      visible: true
    initialPartOf: []
    presentation:
      firstUse: |
        Von allen Schrecken ist stets der am teuflischsten, der vollkommen unerwartet
        eintritt und so grotesk ist, dass man ihn kaum glauben kann. Nichts, was du
        bisher erlebt hast, kommt dem bizarren Entsetzen gleich, das sich deinem Blick
        offenbart.

        Statt einer schwindelerregenden Aussicht aus großer Höhe auf Baumwipfel
        erstreckt sich vor dem Eisengitter nach allen Seiten fester Erdboden. Er ist
        bedeckt mit marmornen Platten und Säulen und überschattet von einer uralten
        Steinkirche, deren verfallener Glockenturm im Mondlicht gespenstisch leuchtet.

        Halb benommen öffnest du das Gitter und taumelst auf einen weißen Kieselpfad
        hinaus. Dein Verstand ist benebelt und im Aufruhr, doch noch immer erfüllt dich
        die unbändige Sehnsucht nach Licht. Nicht einmal dieser unmögliche Anblick kann
        dich davon abbringen.

        Du weißt nicht, ob dies eine irre Einbildung, ein Traum oder Zauberei ist. Du
        weißt nicht, wer du bist, was du bist oder was deine Umgebung bedeutet. Doch
        du bist entschlossen, strahlendes Licht und Lebensfreude zu erblicken – koste
        es, was es wolle.
      repeatUse: Das Gitter führt ebenerdig auf den weißen Kieselpfad hinaus.
    onUse:
      - id: open_iron_grating
        enabled: true
        effects:
          - setElementState: [surface_world_present, visible, true]
          - setElementState: [graveyard_present, visible, true]
          - setCurrentElement: graveyard_present

  - id: path_gate_to_high_chamber
    name: Steinportal zurück zur hohen Kammer
    type: door
    physical: true
    layers: [present]
    locatedIn: moon_gate_present
    initialState:
      visible: true
    initialPartOf: []
    onUse:
      - id: return_high_chamber
        enabled: true
        effects:
          - setCurrentElement: high_chamber_present

  - id: graveyard_present
    name: Friedhof im Mondlicht
    type: room
    physical: true
    layers: [present]
    locatedIn: surface_world_present
    exitLabel: Friedhof verlassen
    image: "Ein uralter Friedhof im Vollmond, weiße Kieselwege, marmorne Grabplatten und Säulen, eine verfallene Steinkirche mit gespenstischem Glockenturm, offenes Eisengitter im Boden."
    initialState:
      visible: false
      investigation: open
      currentHint: Kirche, Marmorplatten und Kieselpfad können untersucht werden.
    initialPartOf: []
    presentation:
      firstView: |
        Das Gitter befindet sich nicht auf einem Turm, sondern am Rand eines alten
        Friedhofs. Marmorne Platten und Säulen stehen ringsum im weißen Mondlicht. Die
        Falltür, durch die du gekrochen bist, muss tief unter diesem festen Boden
        liegen – doch dein Verstand findet keine Erklärung dafür.

        Ein Kieselpfad führt durch einen Torbogen aus diesem Reich der Platten und
        Säulen hinaus. Während du ihn betrachtest, dringt eine erschreckende, lange
        verbannte Erinnerung in dein Bewusstsein. Der Weg erscheint dir nicht völlig
        fremd.
      repeatView: >-
        Der weiße Kieselpfad windet sich zwischen Marmorplatten und der verfallenen
        Kirche hindurch zum Torbogen.

  - id: ancient_church_present
    name: Uralte Steinkirche
    type: place
    physical: true
    layers: [present]
    locatedIn: graveyard_present
    initialState:
      visible: true
      investigation: open
    initialPartOf: []
    presentation:
      firstUse: >-
        Der Glockenturm ist teilweise eingestürzt. Sein Schatten fällt über die
        marmornen Platten, und das bleiche Licht lässt jede Kante wie den Knochen eines
        gewaltigen Gerippes erscheinen. Du findest keine offene Tür.
      repeatUse: Die verfallene Kirche bleibt verschlossen und schweigt im Mondlicht.
    onUse:
      - id: inspect_ancient_church
        enabled: true
        effects:
          - setElementState: [ancient_church_present, investigation, complete]
          - disableSelfTrigger: inspect_ancient_church

  - id: marble_slabs_present
    name: Marmorne Platten und Säulen
    type: object_collection
    physical: true
    layers: [present]
    locatedIn: graveyard_present
    initialState:
      visible: true
      investigation: open
    initialPartOf: []
    presentation:
      firstUse: >-
        Die Platten tragen verwitterte Zeichen und Namen, doch du verstehst ihre
        Ordnung nicht. Einige Formen gleichen den Reliefs des Steinportals. Du spürst,
        dass dieser Ort etwas mit den hohen Kammern verbindet, aber die Bedeutung
        entzieht sich dir.
      repeatUse: Die Zeichen auf den Marmorplatten bleiben dir unverständlich.
    onUse:
      - id: inspect_marble_slabs
        enabled: true
        effects:
          - setElementState: [marble_slabs_present, investigation, complete]
          - disableSelfTrigger: inspect_marble_slabs

  - id: path_to_distant_manor
    name: Kieselpfad durch den Torbogen
    type: door
    physical: true
    layers: [present]
    locatedIn: graveyard_present
    initialState:
      visible: true
    initialPartOf: []
    presentation:
      firstUse: |
        Du verlässt das Reich der Platten und Säulen und wanderst über das offene Land.
        Manchmal folgst du einer sichtbaren Straße, manchmal verlässt du sie und gehst
        über Wiesen, wo nur gelegentliche Reste von der früheren Gegenwart eines Weges
        künden.

        Ein rasch dahinströmender Fluss versperrt dir den Weg. Im Wasser ragt
        zerfallenes, moosbedecktes Mauerwerk empor – Überreste einer Brücke, die seit
        langer Zeit verschwunden ist. Du schwimmst durch die kalte Strömung und setzt
        deine Wanderung fort.

        Mehr als zwei Stunden vergehen, bis du das erreichst, was dir dein Ziel zu sein
        scheint: ein ehrwürdiges, von Efeu umschlungenes Schloss in einem dicht
        bewaldeten Park. Der Ort kommt dir auf rasend machende Weise zugleich vertraut
        und verstörend fremd vor.
      repeatUse: Der lange Weg führt über Wiesen und einen kalten Fluss zum erleuchteten Schloss.
    onUse:
      - id: walk_to_distant_manor
        enabled: true
        effects:
          - setElementState: [distant_manor_present, visible, true]
          - setCurrentElement: distant_manor_present

  - id: path_graveyard_to_gate
    name: Eisengitter zurück zur Mondkammer
    type: door
    physical: true
    layers: [present]
    locatedIn: graveyard_present
    initialState:
      visible: true
    initialPartOf: []
    onUse:
      - id: return_moon_gate
        enabled: true
        effects:
          - setCurrentElement: moon_gate_present

  # ---------------------------------------------------------------------
  # Das erleuchtete Schloss und das Fest
  # ---------------------------------------------------------------------

  - id: surface_world_present
    name: Die Welt unter dem Mond
    type: area
    physical: true
    layers: [present]
    locatedIn: null
    initialState:
      visible: false
      investigation: open
    initialPartOf: []
    presentation:
      firstView: Zum ersten Mal liegt eine offene Welt unter dem Himmel vor dir.
      repeatView: Mondlicht liegt über Friedhof, Wiesen, Fluss und Park.

  - id: distant_manor_present
    name: Erleuchtetes Schloss im Park
    type: room
    physical: true
    layers: [present]
    locatedIn: surface_world_present
    exitLabel: Schlosspark verlassen
    image: "Ein ehrwürdiges von Efeu umschlungenes Schloss in einem dicht bewaldeten Park, viele offene Fenster voller warmem Licht, dahinter eine festliche Gesellschaft, Vollmondnacht."
    initialState:
      visible: false
      investigation: open
      currentHint: Bauwerk, offene Fenster und hoher Durchlass können untersucht werden.
    initialPartOf: []
    presentation:
      firstView: |
        Das Schloss im Park ist dir wohlbekannt und doch auf verstörende Weise
        verändert. Der Burggraben führt Wasser, einige vertraute Türme sind beschädigt,
        und neue Seitenflügel verwirren deinen Blick. Du kannst nicht sagen, woher du
        diese Mauern kennst.

        Was du mit größtem Interesse und Entzücken betrachtest, sind die offenen
        Fenster. Prächtig erfüllt von Licht gießen sie die Klänge eines ausgelassenen
        Festes in die Nacht. Zum ersten Mal hörst du menschliche Stimmen.
      repeatView: >-
        Licht und die Klänge des Festes strömen aus den offenen Fenstern. Das
        efeuumrankte Schloss bleibt zugleich vertraut und fremd.

  - id: altered_manor_present
    name: Vertraute und fremde Mauern
    type: place
    physical: true
    layers: [present]
    locatedIn: distant_manor_present
    initialState:
      visible: true
      investigation: open
    initialPartOf: []
    presentation:
      firstUse: >-
        Manche Mauern stehen genau dort, wo du sie erwartest. Andere fehlen, und an
        ihrer Stelle erheben sich neue Flügel. Erinnerungen zucken am Rand deines
        Bewusstseins auf, zu fern und zu dunkel, um Gestalt anzunehmen.
      repeatUse: Das veränderte Bauwerk weckt Erinnerungen, die sich deinem Zugriff entziehen.
    onUse:
      - id: inspect_altered_manor
        enabled: true
        effects:
          - setElementState: [altered_manor_present, investigation, complete]
          - disableSelfTrigger: inspect_altered_manor

  - id: open_windows_present
    name: Offene Fenster des Festsaals
    type: object
    physical: true
    layers: [present]
    locatedIn: distant_manor_present
    initialState:
      visible: true
      investigation: open
    initialPartOf: []
    presentation:
      firstUse: |
        Du näherst dich einem Fenster und blickst hinein. Eine eigentümlich gekleidete
        Gesellschaft vergnügt sich im strahlenden Saal und unterhält sich heiter. Du
        hast anscheinend nie zuvor die Sprache der Menschen gehört und kannst nur
        unklar vermuten, was sie sagen.

        Einige Gesichter rufen unglaublich ferne Erinnerungen hervor; andere sind dir
        gänzlich fremd. Niemand hat dich bemerkt. Noch trennt dich das Glas vom Licht,
        von den Stimmen und von allem, wonach du dich so lange gesehnt hast.
      repeatUse: Die Gesellschaft feiert weiter. Niemand blickt zum Fenster hinaus.
    onUse:
      - id: observe_open_windows
        enabled: true
        effects:
          - setElementState: [open_windows_present, investigation, complete]
          - disableSelfTrigger: observe_open_windows

  - id: ballroom_entrance_present
    name: Hoher Durchlass zum Festsaal
    type: door
    physical: true
    layers: [present]
    locatedIn: distant_manor_present
    initialState:
      visible: true
    initialPartOf: []
    presentation:
      firstUse: |
        Du trittst durch den hohen Durchlass in den blendend hellen Raum – und
        schreitest damit von deinem einzigen hellen Hoffnungsschimmer in den
        schwärzesten Schlund der Verzweiflung und Erkenntnis.

        Kaum hast du die Schwelle überschritten, da überwältigt die gesamte
        Gesellschaft eine plötzliche Angst von so grässlicher Heftigkeit, dass sich
        jedes Gesicht verzerrt und aus beinahe jeder Kehle schreckliche Schreie
        dringen.

        Alles flieht. Im Tumult verlieren einige das Bewusstsein und werden von ihren
        wie toll flüchtenden Gefährten mitgeschleift. Viele halten sich die Hände vors
        Gesicht, setzen blind und unbeholfen ihre Flucht fort, stoßen Möbel um und
        laufen gegen die Wände, ehe sie eine der Türen erreichen.

        Die Schreie sind markerschütternd. Wenige Augenblicke später stehst du allein
        im strahlend hellen Festsaal und hörst den ersterbenden Echos nach.
      repeatUse: Der hohe Durchlass führt in den verlassenen Festsaal.
    onUse:
      - id: enter_ballroom
        enabled: true
        effects:
          - setElementState: [ballroom_present, visible, true]
          - setCurrentElement: ballroom_present

  - id: path_manor_to_graveyard
    name: Weg zurück zum Friedhof
    type: door
    physical: true
    layers: [present]
    locatedIn: distant_manor_present
    initialState:
      visible: true
    initialPartOf: []
    onUse:
      - id: return_graveyard
        enabled: true
        effects:
          - setCurrentElement: graveyard_present

  - id: ballroom_present
    name: Verlassener Festsaal
    type: room
    physical: true
    layers: [present]
    locatedIn: distant_manor_present
    exitLabel: Festsaal verlassen
    image: "Ein blendend heller historischer Festsaal unmittelbar nach panischer Flucht, umgestürzte Möbel, verlassene Tafel, offene Türen und ein vergoldeter Torbogen zu einem Nebenraum."
    initialState:
      visible: false
      investigation: open
      currentHint: Fluchtspuren und vergoldeter Torbogen können untersucht werden.
    initialPartOf: []
    presentation:
      firstView: |
        Allein und verwirrt stehst du im strahlend hellen Festsaal. Durch die offenen
        Türen verhallen die letzten Schritte. Du erbebst bei dem Gedanken an das, was
        vielleicht verdeckt in deiner Nähe lauert – an jene unsichtbare Gefahr, vor
        der die Menschen geflohen sein müssen.

        Auf den ersten Blick ist der Raum verlassen. Doch als du dich bewegst, glaubst
        du eine Gegenwart wahrzunehmen: die Andeutung einer Bewegung jenseits des
        vergoldeten Torbogens, der in einen ähnlichen Nebenraum führt.
      repeatView: >-
        Der Festsaal bleibt verlassen. Jenseits des vergoldeten Torbogens scheint sich
        noch immer etwas zu bewegen.

  - id: panic_traces_present
    name: Spuren der panischen Flucht
    type: object_collection
    physical: true
    layers: [present]
    locatedIn: ballroom_present
    initialState:
      visible: true
      investigation: open
    initialPartOf: []
    presentation:
      firstUse: >-
        Umgestürzte Stühle, zerbrochene Gläser und zurückgelassene Kleidungsstücke
        zeugen von blinder Panik. Nirgends findest du die Spur eines Angreifers. Alle
        Türen stehen offen; alle Menschen sind fort.
      repeatUse: Nichts im Festsaal erklärt die grässliche Furcht der geflohenen Gäste.
    onUse:
      - id: inspect_panic_traces
        enabled: true
        effects:
          - setElementState: [panic_traces_present, investigation, complete]
          - disableSelfTrigger: inspect_panic_traces

  - id: golden_arch_present
    name: Vergoldeter Torbogen
    type: door
    physical: true
    layers: [present]
    locatedIn: ballroom_present
    initialState:
      visible: true
    initialPartOf: []
    presentation:
      firstUse: |
        Du gehst auf den vergoldeten Torbogen zu. Die Gegenwart jenseits davon wird
        deutlicher. Im angrenzenden Raum steht etwas, das sich gleichzeitig mit dir
        bewegt.

        Dann gibst du den ersten Laut von dir, den du je ausgestoßen hast – ein
        grässliches Geheul, das dir fast ebenso heftigen Abscheu einflößt wie seine
        unerträgliche Ursache.

        Vor dir erscheint in grausiger Lebendigkeit jene unfassbare, unbeschreibliche
        und unnennbare Monstrosität, die durch ihr bloßes Erscheinen eine fröhliche
        Festgesellschaft in einen Haufen hysterischer Flüchtlinge verwandelt hat.
      repeatUse: Der vergoldete Torbogen führt zu der reglosen Gestalt im Nebenraum.
    onUse:
      - id: approach_golden_arch
        enabled: true
        effects:
          - setElementState: [mirror_room_present, visible, true]
          - setCurrentElement: mirror_room_present

  - id: path_ballroom_to_manor
    name: Hoher Durchlass zurück in den Park
    type: door
    physical: true
    layers: [present]
    locatedIn: ballroom_present
    initialState:
      visible: true
    initialPartOf: []
    onUse:
      - id: leave_ballroom
        enabled: true
        effects:
          - setCurrentElement: distant_manor_present

  # ---------------------------------------------------------------------
  # Die Gestalt im goldenen Rahmen
  # ---------------------------------------------------------------------

  - id: mirror_room_present
    name: Nebenraum hinter dem goldenen Bogen
    type: room
    physical: true
    layers: [present]
    locatedIn: distant_manor_present
    exitLabel: Nebenraum verlassen
    image: "Ein dunkler Nebenraum hinter einem vergoldeten Torbogen. In einem großen goldenen Rahmen steht eine verweste, knochige, menschenähnliche Gestalt in vermodernder Kleidung; die spiegelnde Fläche bleibt zunächst uneindeutig."
    initialState:
      visible: false
      investigation: open
      currentHint: Die unnennbare Gestalt kann untersucht werden.
    initialPartOf: []
    presentation:
      firstView: |
        Du vermagst kaum anzudeuten, wie die Gestalt aussieht, denn sie ist das
        Ergebnis all dessen, was unrein, unheimlich, unwillkommen, abweichend und
        verabscheuungswürdig ist.

        Sie ist der dämonische Schatten der Verwesung, des undenklichen Alters und des
        Niedergangs; der faulige, triefende Götze einer kranken Offenbarung, die
        grässliche Entblößung all dessen, was die barmherzige Erde für immer hätte
        verbergen sollen.

        Gott weiß, sie ist nicht – oder nicht mehr – von dieser Welt. In ihren
        abgefressenen, die Knochen kaum verhüllenden Umrissen erkennst du eine
        abscheuliche Karikatur der menschlichen Gestalt. Die vermoderte,
        auseinanderfallende Kleidung lässt dich noch heftiger schaudern.

        Du bist beinahe gelähmt. Ein kläglicher Schritt rückwärts vermag dich nicht
        aus dem Bann des namenlosen, stummen Ungeheuers zu lösen.
      repeatView: >-
        Die verwesende Gestalt steht weiterhin unter dem großen goldenen Rahmen und
        hält dich mit ihren glasigen Augen fest.

  - id: apparition_present
    name: Unnennbare Gestalt
    type: object
    physical: true
    layers: [present]
    locatedIn: mirror_room_present
    voice: Standard
    initialState:
      visible: true
      investigation: open
    initialPartOf: []
    presentation:
      firstUse: |
        Verhext von den glasigen Augen, die dich abscheulich anstarren, vermagst du den
        Blick nicht abzuwenden. Nach dem ersten Schock ist deine Wahrnehmung getrübt,
        sodass du das schreckliche Wesen nur noch undeutlich erkennst.

        Du versuchst, eine Hand zu heben und dich vor dem Anblick zu schützen. Deine
        Nerven sind so erschüttert, dass der Arm deinem Willen kaum folgt. Allein der
        Versuch bringt dich aus dem Gleichgewicht, und du musst einige rasche Schritte
        vorwärts machen, um nicht zu stürzen.

        Dabei wird dir die Nähe des Kadavers schmerzlich bewusst. Du glaubst sogar,
        seine hohlen Atemzüge zu hören. Wahnsinnig vor Angst streckst du die Hand aus,
        um die Erscheinung abzuwehren, die dir ebenso ihre verrottete Klaue
        entgegenstreckt.

        In einer fatalen Sekunde kosmischen Schreckens berühren deine Finger die Hand
        des Scheusals unter dem goldenen Bogen.

        Sie treffen auf eine kalte und unnachgiebige Oberfläche aus poliertem Glas.

        Du schreist nicht. Doch in deinem Verstand bricht eine reißende Lawine
        seelenzerstörender Erinnerungen los. In diesem Augenblick weißt du wieder alles,
        was geschehen war. Du erinnerst dich an die Zeit vor dem fürchterlichen Schloss
        und erkennst das veränderte Bauwerk wieder, in dem du stehst.

        Am grauenvollsten aber ist das Erkennen der unheiligen Scheußlichkeit vor dir:
        Es gibt kein fremdes Wesen. Die Gestalt im großen goldenen Rahmen bewegt sich
        mit dir, weil sie dein Spiegelbild ist. Die Menschen flohen vor dir.
      repeatUse: >-
        Im polierten Glas steht kein fremdes Ungeheuer. Du blickst auf dein eigenes,
        vom Grab gezeichnetes Spiegelbild.
      afterRevealText: >-
        Doch im Kosmos existiert ebenso Balsam wie Bitternis, und dieser Balsam ist
        Nepenthes. Der Schwall schwarzer Erinnerungen löst sich in einem Tumult
        widerhallender Bilder auf. Wie im Traum wendest du dich von dem goldenen Rahmen
        ab. Der Weg in die mondhelle Nacht steht offen.
    onUse:
      - id: touch_apparition
        enabled: true
        effects:
          - setElementState: [apparition_present, investigation, complete]
          - setElementState: [mirror_room_present, investigation, complete]
          - setElementState: [mirror_room_present, currentHint, null]
          - disableSelfTrigger: touch_apparition

  - id: path_mirror_to_ballroom
    name: Goldener Bogen zurück zum Festsaal
    type: door
    physical: true
    layers: [present]
    locatedIn: mirror_room_present
    initialState:
      visible: true
    initialPartOf: []
    onUse:
      - id: leave_mirror_room
        enabled: true
        effects:
          - setCurrentElement: ballroom_present

  - id: moonlit_flight_present
    name: In die mondhelle Nacht fliehen
    type: door
    physical: true
    layers: [present]
    locatedIn: mirror_room_present
    initialState:
      visible: false
    initialPartOf: []
    presentation:
      firstUse: |
        Wie im Traum fliehst du aus dem gespenstischen, verfluchten Gebäude und rennst
        rasch und lautlos durch das Mondlicht. Als du zum Friedhof mit seinen marmornen
        Säulen zurückkehrst und die Stufen hinabsteigst, lässt sich die steinerne
        Falltür nicht mehr öffnen. Doch das schmerzt dich nicht. Das uralte Schloss und
        die stummen Bäume hast du immer gehasst.

        Fortan reitest du mit den schadenfrohen und freundlichen Ghoulen auf dem
        Nachtwind und spielst bei Tag in den Katakomben des Nephren-Ka im versiegelten
        und unbekannten Tal von Hadoth am Nil.

        Du weißt, dass du niemals ein anderes Licht sehen wirst als das des Mondes über
        den Felsengräbern von Neb, und dass es für dich kein Vergnügen gibt außer den
        unbeschreiblichen Festen der Nitokris unter der Großen Pyramide. Doch in deiner
        neuen wilden Freiheit ist dir die Bitterkeit deines Andersseins beinahe
        willkommen.

        Denn obgleich Nepenthes dich besänftigt hat, weißt du, dass du immer ein
        Außenseiter sein wirst – ein Fremder in diesem Jahrhundert und unter jenen,
        die noch Menschen sind.
      repeatUse: Die mondhelle Nacht hat dich aufgenommen.
    onUse:
      - id: flee_into_moonlight
        enabled: true
        effects:
          - finishGame: true
